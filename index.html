:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#213241;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}header{background:#162b3b;color:white;padding:19px 5%;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:21px}header small{color:#bcd0da}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}nav{background:white;border-right:1px solid #dce5e8;padding:20px 12px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;margin:3px 0;border-radius:9px;color:#415766;font-size:15px;cursor:pointer}nav button.active{background:#dfeeed;color:#08645d;font-weight:700}main{padding:30px;max-width:1100px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h2{margin:0 0 7px;font-size:27px}p.muted,.muted{color:#6b7e88}.panel{background:white;border:1px solid #e0e8eb;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #17324508}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.metric{background:white;border:1px solid #e0e8eb;border-radius:13px;padding:19px}.metric strong{display:block;font-size:27px;color:#087c74}button.primary{background:#087c74;color:white;border:0;border-radius:8px;padding:11px 15px;cursor:pointer}button.secondary{background:#eef4f5;border:1px solid #d9e3e7;border-radius:8px;padding:9px 12px;color:#294451;cursor:pointer}button.danger{background:#fff0ef;color:#a43732;border:1px solid #f3d2d0;border-radius:8px;padding:8px;cursor:pointer}input,textarea,select{font:inherit;border:1px solid #ccd9de;border-radius:8px;padding:10px;width:100%;background:white}textarea{min-height:110px;resize:vertical}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:13px;font-weight:650}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.item{border-bottom:1px solid #e7edef;padding:14px 0}.item:last-child{bo const KEY='knowledge-hub-v1';const initial={notes:[{id:'demo1',title:'Was ist Co-Kriging?',category:'Geostatistik',tags:'Interpolation, QGIS',content:'Co-Kriging nutzt zusätzlich zur Zielvariablen räumlich korrelierte Hilfsvariablen. Beispiel für einen Wissenseintrag.',created:'2026-10-18'}],tasks:[{id:'t1',title:'Fachartikel zu Foundation Models lesen',done:false,due:'',category:'Fernerkundung'}],links:[{id:'l1',title:'Copernicus Data Space',url:'https://dataspace.copernicus.eu',category:'Fernerkundung',notes:'Zugang zu Copernicus-Daten',kind:'Weblink'}],cards:[{id:'c1',front:'Was bedeutet Bootstrapping beim Random Forest?',back:'Ziehen von Trainingsstichproben mit Zurücklegen, für jeden Baum separat.',deck:'Machine Learning',due:'2026-10-18',interval:0,repetitions:0}],maps:[{id:'map1',title:'Meine erste Mindmap',nodes:[{id:'n1',text:'Wissensdatenbank',x:220,y:120},{id:'n2',text:'Fachartikel',x:40,y:260},{id:'n3',text:'Lernkarten',x:370,y:270}],edges:[['n1','n2'],['n1','n3']]}],sketches:[],diagrams:[{id:'d1',title:'Beispiel: Forschungsworkflow',category:'Methoden',source:'flowchart LR\n A[Fragestellung] --> B[Daten]\n B --> C[Analyse]\n C --> D[Ergebnis]'}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)};for(const k of Object.keys(initial))if(!Array.isArray(db[k]))db[k]=[];let page='dashboard',editId=null,showAnswer=false,cardIndex=0,search='';const sections=[['dashboard','⌂ Übersicht'],['notes','▤ Wissen'],['tasks','☑ Aufgaben'],['links','↗ Links & PDFs'],['cards','▣ Karteikarten'],['diagrams','◇ Diagramme'],['maps','◎ Mindmap'],['sketches','✎ Handschrift'],['settings','⚙ Daten & Export']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const today=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(db));scheduleCloudSave()}function go(p){page=p;editId=null;search='';render()}function render(){document.getElementById('nav').innerHTML=sections.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');document.getElementById('main').innerHTML=({dashboard,notes,tasks,links,cards,diagrams,maps,sketches,settings})[page]();if(page==='maps')setupMap();if(page==='sketches')setupSketch();}function title(t,s){return `<div class="top"><div><h2>${t}</h2><p class="muted">${s}</p></div></div>`}function empty(){return '<div class="empty">Noch keine Einträge vorhanden.</div>'}function tags(s){return String(s||'').split(',').filter(Boolean).map(t=>`<span class="pill">${esc(t.trim())}</span>`).join('')}function dashboard(){return title('Dein Wissen an einem Ort','Notizen, Quellen, Aufgaben und Lernkarten miteinander verbinden.')+`<div class="cards">${[['Wissenseinträge',db.notes.length,'notes'],['Offene Aufgaben',db.tasks.filter(x=>!x.done).length,'tasks'],['Links & PDFs',db.links.length,'links'],['Karteikarten',db.cards.length,'cards']].map(([l,n,p])=>`<div class="metric" onclick="go('${p}')" style="cursor:pointer"><strong>${n}</strong>${l}</div>`).join('')}</div><div class="panel"><h3>Offene Aufgaben</h3>${db.tasks.filter(x=>!x.done).slice(0,5).map(x=>`<div class="item">☐ ${esc(x.title)}</div>`).join('')||empty()}</div><div class="panel"><h3>Zu wiederholende Karteikarten</h3><p>${db.cards.filter(c=>(c.due||today())<=today()).length} Karte(n) sind heute fällig.</p><button class="primary" onclick="go('cards')">Jetzt lernen</button></div>`}function filtered(arr){return arr.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase()))}function toolbar(label){return `<div class="row"><input style="flex:1;min-width:160px" aria-label="Suche" placeholder="Sammlung durchsuchen" value="${esc(search)}" oninput="search=this.value;renderKeepFocus()"><button class="primary" onclick="editId='new';render()">+ ${label}</button></div>`}function renderKeepFocus(){const pos=document.activeElement.selectionStart;render();const e=document.querySelector('input[aria-label="Suche"]');e.focus();e.setSelectionRange(pos,pos)}function formFor(kind,fields){const x=editId==='new'?{}:db[kind].find(z=>z.id===editId)||{};return `<div class="panel"><h3>${editId==='new'?'Neu anlegen':'Bearbeiten'}</h3><form class="form" onsubmit="submitEntry(event,'${kind}')">${fields.map(([name,label,type,required])=>`<label>${label}${type==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(x[name])}</textarea>`:`<input name="${name}" type="${type||'text'}" value="${esc(x[name])}" ${required?'required':''}>`}</label>`).join('')}<div class="row"><button class="primary">Speichern</button><button type="button" class="secondary" onclick="editId=null;render()">Abbrechen</button></div></form></div>`}function submitEntry(e,kind){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));if(kind==='links'){try{const u=new URL(obj.url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{alert('Bitte eine gültige https://- oder http://-Adresse eingeben.');return}}if(kind==='cards'){obj.due=today();obj.interval=0;obj.repetitions=0}if(kind==='tasks')obj.done=editId==='new'?false:db.tasks.find(x=>x.id===editId)?.done||false;if(editId==='new')db[kind].unshift({id:uid(),...obj});else db[kind]=db[kind].map(x=>x.id===editId?{...x,...obj}:x);editId=null;save();render()}function del(kind,id){if(confirm('Eintrag wirklich löschen?')){db[kind]=db[kind].filter(x=>x.id!==id);save();render()}}function actions(kind,id){return `<div class="row"><button class="secondary" onclick="editId='${id}';render()">Bearbeiten</button><button class="danger" onclick="del('${kind}','${id}')">Löschen</button></div>`}function notes(){return title('Wissensdatenbank','Eigene Notizen, Themen und Querverweise.')+toolbar('Notiz')+(editId?formFor('notes',[['title','Titel','text',true],['category','Themenbereich'],['tags','Schlagwörter (kommagetrennt)'],['content','Inhalt','textarea',true]]):'')+`<div class="panel">${filtered(db.notes).map(x=>`<div class="item"><h3>${esc(x.title)}</h3><span class="muted">${esc(x.category)}</span><div>${tags(x.tags)}</div><p style="white-space:pre-wrap">${esc(x.content)}</p>${actions('notes',x.id)}</div>`).join('')||empty()}</div>`}function tasks(){return title('To-do-Listen','Aufgaben mit Fälligkeit und Themenbezug.')+toolbar('Aufgabe')+(editId?formFor('tasks',[['title','Aufgabe','text',true],['category','Projekt / Thema'],['due','Fällig am','date']]):'')+`<div class="panel">${filtered(db.tasks).map(x=>`<div class="item row"><input style="width:20px" type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><div style="flex:1"><strong style="${x.done?'text-decoration:line-through;color:#8a9aa2':''}">${esc(x.title)}</strong><div class="hint">${esc(x.category)} ${x.due?'· Fällig: '+esc(x.due):''}</div></div>${actions('tasks',x.id)}</div>`).join('')||empty()}</div>`}function toggleTask(id){let x=db.tasks.find(z=>z.id===id);x.done=!x.done;save();render()}function links(){return title('Weblinks & PDF-Bibliothek','Quellen extern speichern, hier strukturiert erschließen.')+toolbar('Link / PDF')+(editId?formFor('links',[['title','Titel','text',true],['url','URL (https://...)','url',true],['kind','Typ (PDF, Weblink, Paper ...)'],['category','Thema'],['notes','Zusammenfassung / eigene Notizen','textarea']]):'')+`<div class="panel">${filtered(db.links).map(x=>`<div class="item"><h3>${esc(x.title)}</h3>${tags(x.kind+','+x.category)}<p>${esc(x.notes)}</p><p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Quelle öffnen ↗</a></p>${actions('links',x.id)}</div>`).join('')||empty()}</div>`}function cards(){let due=db.cards.filter(c=>(c.due||today())<=today());if(cardIndex>=due.length)cardIndex=0;let c=due[cardIndex];return title('Karteikarten','Manuell lernen – ohne KI, mit Wiederholungsintervallen.')+`<div class="row"><button class="primary" onclick="editId='new';render()">+ Karte erstellen</button><span class="hint">${due.length} heute fällig · ${db.cards.length} insgesamt</span></div>`+(editId?formFor('cards',[['front','Vorderseite / Frage','textarea',true],['back','Rückseite / Antwort','textarea',true],['deck','Stapel / Thema','text',true]]):'')+`<div class="panel">${c?`<span class="pill">${esc(c.deck)}</span><div class="flash" onclick="showAnswer=!showAnswer;render()">${esc(showAnswer?c.back:c.front)}<div class="hint">Antippen zum Umdrehen</div></div>${showAnswer?`<div class="row" style="margin-top:15px"><button class="secondary" onclick="rate('${c.id}',0)">Noch lernen</button><button class="secondary" onclick="rate('${c.id}',1)">Schwierig</button><button class="primary" onclick="rate('${c.id}',2)">Gewusst</button></div>`:'<p class="hint">Erst Antwort aufdecken, dann bewerten.</p>'}`:'<div class="empty">Alle Karten für heute erledigt!</div>'}</div><div class="panel"><h3>Alle Karteikarten</h3>${db.cards.map(x=>`<div class="item"><strong>${esc(x.front)}</strong><div class="hint">${esc(x.deck)} · nächste Wiederholung: ${esc(x.due||today())}</div>${actions('cards',x.id)}</div>`).join('')||empty()}</div>`}function rate(id,r){let c=db.cards.find(x=>x.id===id);let days=r===0?0:r===1?1:c.interval===0?2:Math.min(180,Math.round(c.interval*2.3));c.interval=days;c.repetitions=(c.repetitions||0)+1;let d=new Date();d.setDate(d.getDate()+days);c.due=d.toISOString().slice(0,10);save();showAnswer=false;cardIndex=0;render()}function diagrams(){return title('Diagramme','Diagrammdefinitionen als Mermaid-Text speichern und extern rendern.')+`<div class="panel"><p class="muted">Die Vorschau nutzt Mermaid über ein externes CDN, sofern eine Internetverbindung besteht. Diagrammtexte bleiben lokal gespeichert.</p></div>`+toolbar('Diagramm')+(editId?formFor('diagrams',[['title','Titel','text',true],['category','Thema'],['source','Mermaid-Diagrammcode','textarea',true]]):'')+`<div class="panel">${filtered(db.diagrams).map(x=>`<div class="item"><h3>${esc(x.title)}</h3><span class="pill">${esc(x.category)}</span><pre>${esc(x.source)}</pre><button class="secondary" onclick="previewDiagram('${x.id}')">Diagramm anzeigen</button> ${actions('diagrams',x.id)}<div id="preview-${x.id}"></div></div>`).join('')||empty()}</div>`}function previewDiagram(id){const x=db.diagrams.find(z=>z.id===id);const el=document.getElementById('preview-'+id);el.innerHTML='<div class="hint">Diagramm wird geladen …</div>';if(!window.mermaid){let s=document.createElement('script');s.type='module';s.textContent=`import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'; window.mermaid=mermaid;window.dispatchEvent(new Event('mermaidReady'));`;document.body.appendChild(s);window.addEventListener('mermaidReady',()=>drawMermaid(el,x),{once:true});setTimeout(()=>{if(!window.mermaid)el.textContent='Vorschau benötigt Internetzugang.'},7000)}else drawMermaid(el,x)}async function drawMermaid(el,x){try{mermaid.initialize({startOnLoad:false,securityLevel:'strict'});const result=await mermaid.render('m'+Date.now(),x.source);el.innerHTML=result.svg}catch(e){el.textContent='Ungültiger Diagrammcode: '+e.message}}let activeMap='map1',selectedNode=null,linkFrom=null;
function maps(){let m=db.maps.find(x=>x.id===activeMap)||db.maps[0];if(!m)return title('Mindmaps','Verschiebbare Elemente und Verbindungen.')+'<button class="primary" onclick="newMap()">+ Mindmap</button>';activeMap=m.id;return title('Mindmaps','Knoten verschieben, bearbeiten und verbinden. Änderungen werden lokal gespeichert.')+`<div class="row"><select style="max-width:240px" onchange="activeMap=this.value;selectedNode=null;render()">${db.maps.map(x=>`<option value="${esc(x.id)}" ${x.id===m.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><button class="secondary" onclick="newMap()">+ Neue Map</button><button class="secondary" onclick="addNode()">+ Element</button><button class="secondary" onclick="connectNodes()">Verbinden</button><button class="danger" onclick="deleteMap()">Map löschen</button></div><div class="panel"><p class="hint">Element antippen zum Auswählen, ziehen zum Verschieben. Zum Verbinden zuerst ein Element auswählen, dann „Verbinden“ und das Ziel antippen. Doppeltippen zum Umbenennen.</p><div class="mapviewport"><svg id="mapSvg" viewBox="0 0 700 450" aria-label="Interaktive Mindmap" role="group"><rect width="700" height="450" fill="#f8fbfc"/>${m.edges.map(([a,b])=>{let n=m.nodes.find(x=>x.id===a),v=m.nodes.find(x=>x.id===b);return n&&v?`<line x1="${n.x+70}" y1="${n.y+22}" x2="${v.x+70}" y2="${v.y+22}" stroke="#7d9da5" stroke-width="2"/>`:''}).join('')}${m.nodes.map(n=>`<g class="mapnode" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.text)}"><rect x="${n.x}" y="${n.y}" width="140" height="44" rx="11" fill="${selectedNode===n.id?'#c8eee7':'#ffffff'}" stroke="#438a86" stroke-width="2"/><text x="${n.x+70}" y="${n.y+27}" font-size="13" text-anchor="middle" fill="#203b43">${esc(n.text.slice(0,22))}</text></g>`).join('')}</svg></div><div class="row" style="margin-top:12px"><button class="secondary" onclick="renameNode()">Auswahl umbenennen</button><button class="secondary" onclick="moveNode(-25,0)">←</button><button class="secondary" onclick="moveNode(25,0)">→</button><button class="secondary" onclick="moveNode(0,-25)">↑</button><button class="secondary" onclick="moveNode(0,25)">↓</button><button class="danger" onclick="removeNode()">Auswahl löschen</button></div><p class="hint" id="mapStatus">${selectedNode?'Element ausgewählt':'Noch kein Element ausgewählt'}</p></div>`}
function currentMap(){return db.maps.find(x=>x.id===activeMap)}
function newMap(){let name=prompt('Name der Mindmap:','Neue Mindmap');if(!name?.trim())return;let id=uid();db.maps.push({id,title:name.trim(),nodes:[],edges:[]});activeMap=id;selectedNode=null;save();render()}
function deleteMap(){if(!confirm('Diese Mindmap löschen?'))return;db.maps=db.maps.filter(x=>x.id!==activeMap);activeMap=db.maps[0]?.id;selectedNode=null;save();render()}
function addNode(){let text=prompt('Text des Elements:','Neues Thema');if(!text?.trim())return;let m=currentMap();let id=uid();m.nodes.push({id,text:text.trim(),x:Math.min(540,40+m.nodes.length*35),y:Math.min(390,50+m.nodes.length*45)});selectedNode=id;save();render()}
function renameNode(){let n=currentMap()?.nodes.find(x=>x.id===selectedNode);if(!n)return alert('Zuerst Element auswählen.');let t=prompt('Element umbenennen:',n.text);if(t?.trim()){n.text=t.trim();save();render()}}
function removeNode(){let m=currentMap();if(!selectedNode)return;m.nodes=m.nodes.filter(n=>n.id!==selectedNode);m.edges=m.edges.filter(e=>!e.includes(selectedNode));selectedNode=null;save();render()}
function moveNode(dx,dy){let n=currentMap()?.nodes.find(x=>x.id===selectedNode);if(!n)return;n.x=Math.max(0,Math.min(560,n.x+dx));n.y=Math.max(0,Math.min(406,n.y+dy));save();render()}
function connectNodes(){if(!selectedNode)return alert('Zuerst das Ausgangselement auswählen.');linkFrom=selectedNode;document.getElementById('mapStatus').textContent='Jetzt das Zielelement antippen.'}
function setupMap(){let svg=document.getElementById('mapSvg');if(!svg)return;let dragging=null,moved=false;const pos=e=>{let pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let p=pt.matrixTransform(svg.getScreenCTM().inverse());return p};svg.querySelectorAll('.mapnode').forEach(g=>{g.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=g.dataset.node;moved=false;g.setPointerCapture(e.pointerId)});g.addEventListener('pointermove',e=>{if(dragging!==g.dataset.node)return;let n=currentMap().nodes.find(x=>x.id===dragging),pt=pos(e);if(Math.abs(n.x-(pt.x-70))>3||Math.abs(n.y-(pt.y-22))>3)moved=true;n.x=Math.max(0,Math.min(560,pt.x-70));n.y=Math.max(0,Math.min(406,pt.y-22));if(moved){svg.querySelectorAll('line').forEach((l,i)=>{let edge=currentMap().edges[i],a=currentMap().nodes.find(z=>z.id===edge[0]),b=currentMap().nodes.find(z=>z.id===edge[1]);if(a&&b){l.setAttribute('x1',a.x+70);l.setAttribute('y1',a.y+22);l.setAttribute('x2',b.x+70);l.setAttribute('y2',b.y+22)}});g.querySelector('rect').setAttribute('x',n.x);g.querySelector('rect').setAttribute('y',n.y);g.querySelector('text').setAttribute('x',n.x+70);g.querySelector('text').setAttribute('y',n.y+27)}});g.addEventListener('pointerup',()=>{if(!dragging)return;let id=dragging;dragging=null;if(linkFrom&&linkFrom!==id){let m=currentMap();if(!m.edges.some(e=>e[0]===linkFrom&&e[1]===id))m.edges.push([linkFrom,id]);linkFrom=null}else if(!moved)selectedNode=id;save();render()});g.addEventListener('dblclick',()=>{selectedNode=g.dataset.node;renameNode()});g.addEventListener('keydown',e=>{if(e.key==='Enter'){selectedNode=g.dataset.node;render()}})})}
function sketches(){return title('Handschriftliche Notizen','Mit Apple Pencil, Finger oder Maus direkt schreiben.')+`<div class="row"><input id="sketchTitle" aria-label="Titel" placeholder="Titel der Notiz" value="Schnelle Notiz" style="max-width:290px"><button class="primary" onclick="saveSketch()">Notiz speichern</button><button class="secondary" onclick="clearSketch()">Leeren</button></div><div class="panel"><p class="hint">Apple Pencil wird als Stift unterstützt. Handballenauflage hängt von iPad und Browser ab. Zeichnung als PNG speichern; keine Texterkennung.</p><div class="drawbox"><canvas id="drawCanvas" width="1200" height="700" aria-label="Schreibfläche"></canvas></div></div><div class="panel"><h3>Gespeicherte Notizen</h3>${db.sketches.map(x=>`<div class="item"><strong>${esc(x.title)}</strong><div><img alt="Handschriftliche Notiz" src="${x.data}" style="width:100%;max-width:440px;border:1px solid #ddd"><div class="row"><button class="secondary" onclick="downloadSketch('${x.id}')">PNG herunterladen</button><button class="danger" onclick="deleteSketch('${x.id}')">Löschen</button></div></div></div>`).join('')||empty()}</div>`}
let drawCtx,drawActive=false;function setupSketch(){let c=document.getElementById('drawCanvas');if(!c)return;drawCtx=c.getContext('2d');drawCtx.fillStyle='white';drawCtx.fillRect(0,0,c.width,c.height);drawCtx.strokeStyle='#243c4b';drawCtx.lineWidth=3;drawCtx.lineCap='round';drawCtx.lineJoin='round';const xy=e=>{let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};c.addEventListener('pointerdown',e=>{drawActive=true;c.setPointerCapture(e.pointerId);let [x,y]=xy(e);drawCtx.beginPath();drawCtx.moveTo(x,y);drawCtx.lineTo(x+.01,y+.01);drawCtx.stroke()});c.addEventListener('pointermove',e=>{if(!drawActive)return;let [x,y]=xy(e);drawCtx.lineWidth=e.pointerType==='pen'?Math.max(1.5,4*(e.pressure||.5)):3;drawCtx.lineTo(x,y);drawCtx.stroke()});for(let t of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(t,()=>{drawActive=false})}
function clearSketch(){if(confirm('Schreibfläche leeren?')){let c=document.getElementById('drawCanvas');drawCtx.fillStyle='white';drawCtx.fillRect(0,0,c.width,c.height)}}
function saveSketch(){let c=document.getElementById('drawCanvas'),title=document.getElementById('sketchTitle').value.trim()||'Notiz';try{db.sketches.unshift({id:uid(),title,data:c.toDataURL('image/png')});save();render()}catch{db.sketches.shift();alert('Browserspeicher voll. Bitte zuerst JSON-Backup exportieren und alte Zeichnungen löschen.')}}
function downloadSketch(id){let x=db.sketches.find(z=>z.id===id);if(!x)return;let a=document.createElement('a');a.href=x.data;a.download='handschrift-'+id+'.png';a.click()}
function deleteSketch(id){if(!confirm('Notiz löschen?'))return;db.sketches=db.sketches.filter(x=>x.id!==id);save();render()}
function settings(){return title('Daten & Export','Kontrolle über deine Informationen behalten.')+`<div class="panel"><h3>Lokale Datensicherung</h3><p>Alle Daten befinden sich aktuell im Browser dieses Geräts. Löschen von Browserdaten kann sie entfernen. Exportiere regelmäßig eine Sicherung.</p><div class="row"><button class="primary" onclick="exportData()">JSON-Backup herunterladen</button><label class="secondary" style="cursor:pointer">JSON-Backup importieren<input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none"></label></div></div><div class="panel"><h3>Cloud-Synchronisierung</h3><p>Cloud-Synchronisierung für Wissen, Aufgaben, Links, Karteikarten und Mindmaps ist aktiviert. <strong>Diagramme und Handschrift bleiben in dieser Zwischenversion ausschließlich lokal</strong> und benötigen JSON-Backups. Notiz-Tags/Kategorien werden derzeit nicht synchronisiert.</p></div><div class="panel"><h3>Datenschutz</h3><p>Keine Analyse-Tracker und keine KI-Dienste. Externe Links werden nur beim Öffnen kontaktiert; die Diagrammvorschau lädt Mermaid über ein CDN.</p></div>`}function exportData(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='knowledge-hub-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(e){const f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(![1,2].includes(j.version)||!j.data||!['notes','tasks','links','cards','diagrams'].every(k=>Array.isArray(j.data[k])))throw Error('Unbekanntes Format');if(!confirm('Alle aktuellen Daten durch dieses Backup ersetzen?'))return;db=j.data;for(const k of Object.keys(initial))if(!Array.isArray(db[k]))db[k]=[];save();render();alert('Import abgeschlossen')}catch(err){alert('Import fehlgeschlagen: '+err.message)}}// Supabase Cloud-Verbindung: nur Publishable Key; nie Secret-/Service-Role-Key.
const CLOUD_URL='https://ucmwsbesdgsllzrawxhg.supabase.co';
const CLOUD_KEY='sb_publishable_-EGtB_WPW6ekoEczgo3uhg_G-qTELmi';
const CLOUD_TOKEN_KEY='kh_cloud_session_v03';
const cloudSpecs={
 notes:{table:'kh_entries',to:x=>({id:x.id,title:x.title,content:x.content||'',entry_type:'Notiz',status:'Neu'}),from:x=>({id:x.id,title:x.title,content:x.content||'',category:'',tags:'',created:x.created_at})},

 maps:{table:'kh_mindmaps',to:x=>({id:x.id,title:x.title,nodes:x.nodes||[],edges:x.edges||[]}),from:x=>({id:x.id,title:x.title,nodes:x.nodes||[],edges:x.edges||[]})}
};
let cloudSession=null,cloudTimer=null,cloudBusy=false,cloudDirty=false,cloudLoaded=false;
const statusText=(t)=>{document.getElementById('cloudStatus').textContent=t};
function cloudHeaders(){return {'apikey':CLOUD_KEY,'Authorization':'Bearer '+cloudSession.access_token,'Content-Type':'application/json'}}
async function cloudRequest(path,opts={}){let res=await fetch(CLOUD_URL+path,{...opts,headers:{...cloudHeaders(),...(opts.headers||{})}});if(!res.ok){let msg=await res.text();throw Error(res.status+' '+msg.slice(0,220))}return res.status===204?null:res.json()}
async function cloudLogin(email,password){let r=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Anmeldung fehlgeschlagen');cloudSession=d;sessionStorage.setItem(CLOUD_TOKEN_KEY,JSON.stringify(d));await cloudLoad()}
async function refreshCloudToken(){if(!cloudSession?.refresh_token)throw Error('Bitte erneut anmelden');let r=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});let d=await r.json();if(!r.ok)throw Error('Sitzung abgelaufen. Bitte erneut anmelden.');cloudSession=d;sessionStorage.setItem(CLOUD_TOKEN_KEY,JSON.stringify(d))}
async function ensureToken(){if(cloudSession?.expires_at && Date.now()/1000>cloudSession.expires_at-90)await refreshCloudToken()}
async function cloudLoad(){statusText('Lade Cloud-Daten …');await ensureToken();let next=structuredClone(initial);for(const k of Object.keys(next))next[k]=[];for(const [kind,spec] of Object.entries(cloudSpecs)){const rows=await cloudRequest('/rest/v1/'+spec.table+'?select=*');next[kind]=rows.map(spec.from)}// Nicht synchronisierte Module bleiben lokal, werden nie als Cloud-Sicherung bezeichnet.
next.diagrams=db.diagrams||[];next.sketches=db.sketches||[];db=next;cloudLoaded=true;localStorage.setItem(KEY,JSON.stringify(db));document.body.classList.remove('locked');document.getElementById('logoutButton').style.display='inline-block';statusText('Cloud verbunden · Diagramme/Handschrift lokal');render()}
function scheduleCloudSave(){if(!cloudLoaded)return;cloudDirty=true;statusText('Speichere …');clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSync,700)}
async function cloudSync(){if(cloudBusy||!cloudDirty)return;cloudBusy=true;cloudDirty=false;try{await ensureToken();const user=await cloudRequest('/auth/v1/user');for(const [kind,spec] of Object.entries(cloudSpecs)){let rows=db[kind].map(x=>({...spec.to(x),user_id:user.id}));let existing=await cloudRequest('/rest/v1/'+spec.table+'?select=id');let ids=new Set(rows.map(x=>x.id));let removed=existing.filter(x=>!ids.has(x.id)).map(x=>x.id);if(rows.length)await cloudRequest('/rest/v1/'+spec.table+'?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});for(const item of removed)await cloudRequest('/rest/v1/'+spec.table+'?id=eq.'+encodeURIComponent(item),{method:'DELETE'})}statusText('Cloud gespeichert · Diagramme/Handschrift lokal')}catch(e){cloudDirty=true;statusText('⚠ Cloud-Speicherung fehlgeschlagen');alert('Cloud-Speicherung fehlgeschlagen. Änderungen sind vorläufig nur lokal. Bitte JSON-Backup exportieren.\n'+e.message)}finally{cloudBusy=false;if(cloudDirty)statusText('⚠ Nicht vollständig synchronisiert')}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;document.getElementById('loginError').textContent='';try{let f=new FormData(e.target);await cloudLogin(f.get('email'),f.get('password'))}catch(err){document.getElementById('loginError').textContent=err.message;statusText('Nicht angemeldet')}finally{b.disabled=false}});
document.getElementById('logoutButton').addEventListener('click',()=>{clearTimeout(cloudTimer);if(cloudDirty){alert('Noch nicht synchronisierte Änderungen. Bitte zuerst eine Sicherung exportieren.');return}cloudSession=null;cloudLoaded=false;sessionStorage.removeItem(CLOUD_TOKEN_KEY);document.body.classList.add('locked');document.getElementById('logoutButton').style.display='none';statusText('Abgemeldet')});
(async()=>{try{let old=sessionStorage.getItem(CLOUD_TOKEN_KEY);if(old){cloudSession=JSON.parse(old);await cloudLoad()}}catch(e){cloudSession=null;sessionStorage.removeItem(CLOUD_TOKEN_KEY);statusText('Bitte anmelden')}})();
