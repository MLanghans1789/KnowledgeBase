<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162b3b"><title>Knowledge Hub</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#213241;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}header{background:#162b3b;color:white;padding:19px 5%;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:21px}header small{color:#bcd0da}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}nav{background:white;border-right:1px solid #dce5e8;padding:20px 12px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;margin:3px 0;border-radius:9px;color:#415766;font-size:15px;cursor:pointer}nav button.active{background:#dfeeed;color:#08645d;font-weight:700}main{padding:30px;max-width:1100px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h2{margin:0 0 7px;font-size:27px}p.muted,.muted{color:#6b7e88}.panel{background:white;border:1px solid #e0e8eb;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #17324508}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.metric{background:white;border:1px solid #e0e8eb;border-radius:13px;padding:19px}.metric strong{display:block;font-size:27px;color:#087c74}button.primary{background:#087c74;color:white;border:0;border-radius:8px;padding:11px 15px;cursor:pointer}button.secondary{background:#eef4f5;border:1px solid #d9e3e7;border-radius:8px;padding:9px 12px;color:#294451;cursor:pointer}button.danger{background:#fff0ef;color:#a43732;border:1px solid #f3d2d0;border-radius:8px;padding:8px;cursor:pointer}input,textarea,select{font:inherit;border:1px solid #ccd9de;border-radius:8px;padding:10px;width:100%;background:white}textarea{min-height:110px;resize:vertical}.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:13px;font-weight:650}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.item{border-bottom:1px solid #e7edef;padding:14px 0}.item:last-child{border:0}.item h3{margin:0 0 5px;font-size:17px}.pill{display:inline-block;border-radius:20px;background:#e6f2f0;color:#186e65;padding:4px 9px;font-size:12px;margin:3px 4px 3px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.flash{min-height:200px;border:2px dashed #bed6d2;border-radius:14px;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;background:#f5fbfa;font-size:20px;font-weight:600}.hint{font-size:12px;color:#69818a}a{color:#087c74;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8f9;padding:16px;border-radius:8px}.empty{color:#6b7e88;padding:22px;text-align:center}.hidden{display:none}@media(max-width:680px){.layout{display:block}nav{display:flex;overflow-x:auto;position:sticky;top:0;z-index:2;padding:6px;gap:3px}nav button{white-space:nowrap;width:auto;font-size:13px;padding:9px}main{padding:17px}.split{grid-template-columns:1fr}header{padding:15px}h2{font-size:23px}}
</style></head><body><header><div><h1>◈ Knowledge Hub</h1><small>Meine persönliche Wissensdatenbank</small></div><span style="font-size:12px;color:#bcd0da">Lokaler Prototyp · keine Cloud</span></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><script>
const KEY='knowledge-hub-v1';const initial={notes:[{id:'demo1',title:'Was ist Co-Kriging?',category:'Geostatistik',tags:'Interpolation, QGIS',content:'Co-Kriging nutzt zusätzlich zur Zielvariablen räumlich korrelierte Hilfsvariablen. Beispiel für einen Wissenseintrag.',created:'2026-10-18'}],tasks:[{id:'t1',title:'Fachartikel zu Foundation Models lesen',done:false,due:'',category:'Fernerkundung'}],links:[{id:'l1',title:'Copernicus Data Space',url:'https://dataspace.copernicus.eu',category:'Fernerkundung',notes:'Zugang zu Copernicus-Daten',kind:'Weblink'}],cards:[{id:'c1',front:'Was bedeutet Bootstrapping beim Random Forest?',back:'Ziehen von Trainingsstichproben mit Zurücklegen, für jeden Baum separat.',deck:'Machine Learning',due:'2026-10-18',interval:0,repetitions:0}],diagrams:[{id:'d1',title:'Beispiel: Forschungsworkflow',category:'Methoden',source:'flowchart LR\n A[Fragestellung] --> B[Daten]\n B --> C[Analyse]\n C --> D[Ergebnis]'}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)};for(const k of Object.keys(initial))if(!Array.isArray(db[k]))db[k]=[];let page='dashboard',editId=null,showAnswer=false,cardIndex=0,search='';const sections=[['dashboard','⌂ Übersicht'],['notes','▤ Wissen'],['tasks','☑ Aufgaben'],['links','↗ Links & PDFs'],['cards','▣ Karteikarten'],['diagrams','◇ Diagramme'],['settings','⚙ Daten & Export']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const today=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function go(p){page=p;editId=null;search='';render()}function render(){document.getElementById('nav').innerHTML=sections.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');document.getElementById('main').innerHTML=({dashboard,notes,tasks,links,cards,diagrams,settings})[page]();}function title(t,s){return `<div class="top"><div><h2>${t}</h2><p class="muted">${s}</p></div></div>`}function empty(){return '<div class="empty">Noch keine Einträge vorhanden.</div>'}function tags(s){return String(s||'').split(',').filter(Boolean).map(t=>`<span class="pill">${esc(t.trim())}</span>`).join('')}function dashboard(){return title('Dein Wissen an einem Ort','Notizen, Quellen, Aufgaben und Lernkarten miteinander verbinden.')+`<div class="cards">${[['Wissenseinträge',db.notes.length,'notes'],['Offene Aufgaben',db.tasks.filter(x=>!x.done).length,'tasks'],['Links & PDFs',db.links.length,'links'],['Karteikarten',db.cards.length,'cards']].map(([l,n,p])=>`<div class="metric" onclick="go('${p}')" style="cursor:pointer"><strong>${n}</strong>${l}</div>`).join('')}</div><div class="panel"><h3>Offene Aufgaben</h3>${db.tasks.filter(x=>!x.done).slice(0,5).map(x=>`<div class="item">☐ ${esc(x.title)}</div>`).join('')||empty()}</div><div class="panel"><h3>Zu wiederholende Karteikarten</h3><p>${db.cards.filter(c=>(c.due||today())<=today()).length} Karte(n) sind heute fällig.</p><button class="primary" onclick="go('cards')">Jetzt lernen</button></div>`}function filtered(arr){return arr.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase()))}function toolbar(label){return `<div class="row"><input style="flex:1;min-width:160px" aria-label="Suche" placeholder="Sammlung durchsuchen" value="${esc(search)}" oninput="search=this.value;renderKeepFocus()"><button class="primary" onclick="editId='new';render()">+ ${label}</button></div>`}function renderKeepFocus(){const pos=document.activeElement.selectionStart;render();const e=document.querySelector('input[aria-label="Suche"]');e.focus();e.setSelectionRange(pos,pos)}function formFor(kind,fields){const x=editId==='new'?{}:db[kind].find(z=>z.id===editId)||{};return `<div class="panel"><h3>${editId==='new'?'Neu anlegen':'Bearbeiten'}</h3><form class="form" onsubmit="submitEntry(event,'${kind}')">${fields.map(([name,label,type,required])=>`<label>${label}${type==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(x[name])}</textarea>`:`<input name="${name}" type="${type||'text'}" value="${esc(x[name])}" ${required?'required':''}>`}</label>`).join('')}<div class="row"><button class="primary">Speichern</button><button type="button" class="secondary" onclick="editId=null;render()">Abbrechen</button></div></form></div>`}function submitEntry(e,kind){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));if(kind==='links'){try{const u=new URL(obj.url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{alert('Bitte eine gültige https://- oder http://-Adresse eingeben.');return}}if(kind==='cards'){obj.due=today();obj.interval=0;obj.repetitions=0}if(kind==='tasks')obj.done=editId==='new'?false:db.tasks.find(x=>x.id===editId)?.done||false;if(editId==='new')db[kind].unshift({id:uid(),...obj});else db[kind]=db[kind].map(x=>x.id===editId?{...x,...obj}:x);editId=null;save();render()}function del(kind,id){if(confirm('Eintrag wirklich löschen?')){db[kind]=db[kind].filter(x=>x.id!==id);save();render()}}function actions(kind,id){return `<div class="row"><button class="secondary" onclick="editId='${id}';render()">Bearbeiten</button><button class="danger" onclick="del('${kind}','${id}')">Löschen</button></div>`}function notes(){return title('Wissensdatenbank','Eigene Notizen, Themen und Querverweise.')+toolbar('Notiz')+(editId?formFor('notes',[['title','Titel','text',true],['category','Themenbereich'],['tags','Schlagwörter (kommagetrennt)'],['content','Inhalt','textarea',true]]):'')+`<div class="panel">${filtered(db.notes).map(x=>`<div class="item"><h3>${esc(x.title)}</h3><span class="muted">${esc(x.category)}</span><div>${tags(x.tags)}</div><p style="white-space:pre-wrap">${esc(x.content)}</p>${actions('notes',x.id)}</div>`).join('')||empty()}</div>`}function tasks(){return title('To-do-Listen','Aufgaben mit Fälligkeit und Themenbezug.')+toolbar('Aufgabe')+(editId?formFor('tasks',[['title','Aufgabe','text',true],['category','Projekt / Thema'],['due','Fällig am','date']]):'')+`<div class="panel">${filtered(db.tasks).map(x=>`<div class="item row"><input style="width:20px" type="checkbox" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><div style="flex:1"><strong style="${x.done?'text-decoration:line-through;color:#8a9aa2':''}">${esc(x.title)}</strong><div class="hint">${esc(x.category)} ${x.due?'· Fällig: '+esc(x.due):''}</div></div>${actions('tasks',x.id)}</div>`).join('')||empty()}</div>`}function toggleTask(id){let x=db.tasks.find(z=>z.id===id);x.done=!x.done;save();render()}function links(){return title('Weblinks & PDF-Bibliothek','Quellen extern speichern, hier strukturiert erschließen.')+toolbar('Link / PDF')+(editId?formFor('links',[['title','Titel','text',true],['url','URL (https://...)','url',true],['kind','Typ (PDF, Weblink, Paper ...)'],['category','Thema'],['notes','Zusammenfassung / eigene Notizen','textarea']]):'')+`<div class="panel">${filtered(db.links).map(x=>`<div class="item"><h3>${esc(x.title)}</h3>${tags(x.kind+','+x.category)}<p>${esc(x.notes)}</p><p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Quelle öffnen ↗</a></p>${actions('links',x.id)}</div>`).join('')||empty()}</div>`}function cards(){let due=db.cards.filter(c=>(c.due||today())<=today());if(cardIndex>=due.length)cardIndex=0;let c=due[cardIndex];return title('Karteikarten','Manuell lernen – ohne KI, mit Wiederholungsintervallen.')+`<div class="row"><button class="primary" onclick="editId='new';render()">+ Karte erstellen</button><span class="hint">${due.length} heute fällig · ${db.cards.length} insgesamt</span></div>`+(editId?formFor('cards',[['front','Vorderseite / Frage','textarea',true],['back','Rückseite / Antwort','textarea',true],['deck','Stapel / Thema','text',true]]):'')+`<div class="panel">${c?`<span class="pill">${esc(c.deck)}</span><div class="flash" onclick="showAnswer=!showAnswer;render()">${esc(showAnswer?c.back:c.front)}<div class="hint">Antippen zum Umdrehen</div></div>${showAnswer?`<div class="row" style="margin-top:15px"><button class="secondary" onclick="rate('${c.id}',0)">Noch lernen</button><button class="secondary" onclick="rate('${c.id}',1)">Schwierig</button><button class="primary" onclick="rate('${c.id}',2)">Gewusst</button></div>`:'<p class="hint">Erst Antwort aufdecken, dann bewerten.</p>'}`:'<div class="empty">Alle Karten für heute erledigt!</div>'}</div><div class="panel"><h3>Alle Karteikarten</h3>${db.cards.map(x=>`<div class="item"><strong>${esc(x.front)}</strong><div class="hint">${esc(x.deck)} · nächste Wiederholung: ${esc(x.due||today())}</div>${actions('cards',x.id)}</div>`).join('')||empty()}</div>`}function rate(id,r){let c=db.cards.find(x=>x.id===id);let days=r===0?0:r===1?1:c.interval===0?2:Math.min(180,Math.round(c.interval*2.3));c.interval=days;c.repetitions=(c.repetitions||0)+1;let d=new Date();d.setDate(d.getDate()+days);c.due=d.toISOString().slice(0,10);save();showAnswer=false;cardIndex=0;render()}function diagrams(){return title('Diagramme','Diagrammdefinitionen als Mermaid-Text speichern und extern rendern.')+`<div class="panel"><p class="muted">Die Vorschau nutzt Mermaid über ein externes CDN, sofern eine Internetverbindung besteht. Diagrammtexte bleiben lokal gespeichert.</p></div>`+toolbar('Diagramm')+(editId?formFor('diagrams',[['title','Titel','text',true],['category','Thema'],['source','Mermaid-Diagrammcode','textarea',true]]):'')+`<div class="panel">${filtered(db.diagrams).map(x=>`<div class="item"><h3>${esc(x.title)}</h3><span class="pill">${esc(x.category)}</span><pre>${esc(x.source)}</pre><button class="secondary" onclick="previewDiagram('${x.id}')">Diagramm anzeigen</button> ${actions('diagrams',x.id)}<div id="preview-${x.id}"></div></div>`).join('')||empty()}</div>`}function previewDiagram(id){const x=db.diagrams.find(z=>z.id===id);const el=document.getElementById('preview-'+id);el.innerHTML='<div class="hint">Diagramm wird geladen …</div>';if(!window.mermaid){let s=document.createElement('script');s.type='module';s.textContent=`import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'; window.mermaid=mermaid;window.dispatchEvent(new Event('mermaidReady'));`;document.body.appendChild(s);window.addEventListener('mermaidReady',()=>drawMermaid(el,x),{once:true});setTimeout(()=>{if(!window.mermaid)el.textContent='Vorschau benötigt Internetzugang.'},7000)}else drawMermaid(el,x)}async function drawMermaid(el,x){try{mermaid.initialize({startOnLoad:false,securityLevel:'strict'});const result=await mermaid.render('m'+Date.now(),x.source);el.innerHTML=result.svg}catch(e){el.textContent='Ungültiger Diagrammcode: '+e.message}}function settings(){return title('Daten & Export','Kontrolle über deine Informationen behalten.')+`<div class="panel"><h3>Lokale Datensicherung</h3><p>Alle Daten befinden sich aktuell im Browser dieses Geräts. Löschen von Browserdaten kann sie entfernen. Exportiere regelmäßig eine Sicherung.</p><div class="row"><button class="primary" onclick="exportData()">JSON-Backup herunterladen</button><label class="secondary" style="cursor:pointer">JSON-Backup importieren<input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none"></label></div></div><div class="panel"><h3>Cloud-Synchronisierung</h3><p>In diesem Prototyp <strong>nicht aktiviert</strong>. Supabase-Zugangsdaten gehören nicht in dieses Formular. Die produktive Version benötigt Authentifizierung, RLS-Regeln und eine gesonderte Datenanbindung.</p></div><div class="panel"><h3>Datenschutz</h3><p>Keine Analyse-Tracker und keine KI-Dienste. Externe Links werden nur beim Öffnen kontaktiert; die Diagrammvorschau lädt Mermaid über ein CDN.</p></div>`}function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='knowledge-hub-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(e){const f=e.target.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.version!==1||!j.data||!Object.keys(initial).every(k=>Array.isArray(j.data[k])))throw Error('Unbekanntes Format');if(!confirm('Alle aktuellen Daten durch dieses Backup ersetzen?'))return;db=j.data;save();render();alert('Import abgeschlossen')}catch(err){alert('Import fehlgeschlagen: '+err.message)}}render();
</script></body></html>
