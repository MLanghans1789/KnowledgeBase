function topicContents(id){const descendants=topicDescendants(id),ids=new Set([id,...(includeSubtopics?descendants:[])]),direct=db.topicRecords.filter(t=>khTopicParentId(t)===id);const groups=[['notes','Wissenseinträge'],['cards','Lernkarten'],['links','Quellen & PDFs'],['sketches','Handschriftliche Notizen']];const breadcrumb=[];let current=db.topicRecords.find(t=>t.id===id),seen=new Set();while(current&&!seen.has(current.id)){seen.add(current.id);breadcrumb.unshift(current);current=db.topicRecords.find(t=>t.id===khTopicParentId(current))}return `<div class="panel"><div class="row" style="gap:5px">${breadcrumb.map((t,i)=>`${i?'<span class="hint">›</span>':''}<button class="secondary" onclick="detailEntity='${esc(t.id)}';render()">${esc(t.title)}</button>`).join('')}</div><h4>Unterthemen (${direct.length})</h4>${direct.map(t=>`<button class="secondary" style="margin:3px" onclick="detailEntity='${esc(t.id)}';render()">${esc(t.title)} ↗</button>`).join('')||'<p class="hint">Keine direkten Unterthemen gefunden. Prüfe bei den Unterthemen das Feld „Übergeordnetes Thema“.</p>'}<label class="kh-toggle"><input type="checkbox" ${includeSubtopics?'checked':''} onchange="includeSubtopics=this.checked;render()"> Inhalte der Unterthemen einbeziehen</label><p class="hint">${includeSubtopics?`Einbezogen: ${descendants.length} Unterthema/-themen${descendants.length?': '+descendants.map(tid=>esc(entityTitle('topicRecords',tid)||tid)).join(', '):''}`:'Nur direkt zugeordnete Inhalte'}</p>${groups.map(([kind,label])=>{const items=(db[kind]||[]).filter(x=>[...khRelatedTopicIds(kind,x)].some(tid=>ids.has(tid)));return `<h4>${label} (${items.length})</h4>${items.map(x=>`<button class="secondary" style="margin:3px" onclick="openEntity('${kind}','${esc(x.id)}')">${esc(entityTitle(kind,x.id)||'Eintrag')}</button>`).join('')||'<p class="hint">Keine zugeordneten Einträge</p>'}`}).join('')}</div>`}
function createNoteAttached(kind,id){go('notes');editId='new';window.khPendingAttachment={kind,id};render()}
function submitEntry(e,kind){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));const selectedTopicIds=kind==='notes'?new FormData(e.target).getAll('topicIds'):[];delete obj.topicIds;if(kind==='links'){try{const u=new URL(obj.url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{alert('Bitte eine gültige https://- oder http://-Adresse eingeben.');return}}if(kind==='notes'){const old=editId==='new'?null:db.notes.find(x=>x.id===editId);obj.connections=old?.connections||[]}if(kind==='cards'){obj.due=today();obj.interval=0;obj.repetitions=0}if(kind==='tasks'){if(editId==='new'&&quickTaskDate&&!obj.due)obj.due=quickTaskDate;quickTaskDate=null;let old=editId==='new'?null:db.tasks.find(x=>x.id===editId);obj.done=old?.done||false;obj.completed_at=old?.completed_at||null;obj.subtasks_done=old?.subtasks_done||{};obj.repeat=['never','daily','weekly','monthly'].includes(obj.repeat)?obj.repeat:'never';obj.repeat_weekly=obj.repeat==='weekly';if(obj.repeat!=='never'&&!obj.due){alert('Für wiederkehrende Aufgaben bitte ein erstes Fälligkeitsdatum wählen.');return}}if(kind==='projectRecords'){obj.status=obj.status||'Aktiv'}if(kind==='topicRecords'&&obj.parent){const old=editId==='new'?null:editId;if(old&&(obj.parent===old||topicDescendants(old).includes(obj.parent))){alert('Ein Thema kann nicht sein eigenes Unterthema sein.');return}}let savedId=editId==='new'?uid():editId;if(editId==='new')db[kind].unshift({id:savedId,...obj});else db[kind]=db[kind].map(x=>x.id===editId?{...x,...obj}:x);if(kind==='notes'){const savedNote=db.notes.find(x=>x.id===savedId);if(savedNote)savedNote.topicIds=[...new Set(selectedTopicIds)];assignNoteTopics(savedId,selectedTopicIds);if(window.khPendingAttachment){const a=window.khPendingAttachment;if(!db.relations.some(r=>r.fromType==='notes'&&r.fromId===savedId&&r.toType===a.kind&&r.toId===a.id))db.relations.push({id:uid(),fromType:'notes',fromId:savedId,toType:a.kind,toId:a.id,label:'angeheftet an'});window.khPendingAttachment=null}}editId=null;save();render()}function del(kind,id){if(kind==='notes'){db.notes.forEach(n=>n.connections=(n.connections||[]).filter(v=>v!==id));if(selectedNote===id)selectedNote=null;}if(confirm('Eintrag wirklich löschen?')){db.relations=db.relations.filter(r=>!(r.fromType===kind&&r.fromId===id)&&!(r.toType===kind&&r.toId===id));const removed=db[kind].find(x=>x.id===id);if(removed){db.trash=db.trash||[];db.trash.unshift({id:uid(),kind,originalId:id,item:structuredClone(removed),deletedAt:new Date().toISOString()});db.deletedMarks=db.deletedMarks||[];if(!db.deletedMarks.some(x=>x.kind===kind&&x.originalId===id))db.deletedMarks.push({kind,originalId:id,deletedAt:new Date().toISOString()})}db[kind]=db[kind].filter(x=>x.id!==id);save();render()}}function restoreTrash(id){const entry=(db.trash||[]).find(x=>x.id===id);if(!entry)return;db[entry.kind]=db[entry.kind]||[];if(db[entry.kind].some(x=>x.id===entry.originalId)){alert('Eintrag existiert bereits.');return}db[entry.kind].unshift(structuredClone(entry.item));db.trash=db.trash.filter(x=>x.id!==id);db.deletedMarks=(db.deletedMarks||[]).filter(x=>!(x.kind===entry.kind&&x.originalId===entry.originalId));save();render()}
function emptyTrash(){if(!confirm('Papierkorb endgültig leeren? Die Einträge können danach nicht mehr wiederhergestellt werden.'))return;db.trash=[];save();render()}
function trashPanel(){return `<div class="panel"><h3>🗑 Papierkorb (${(db.trash||[]).length})</h3><p class="hint">Gelöschte Einträge können hier wiederhergestellt werden. Die Löschung wird mit Supabase synchronisiert.</p>${(db.trash||[]).map(x=>`<div class="item row"><span style="flex:1"><strong>${esc(x.item?.title||x.item?.front||x.item?.name||'Eintrag')}</strong> <span class="hint">${esc(x.kind)} · ${esc((x.deletedAt||'').slice(0,10))}</span></span><button class="secondary" onclick="restoreTrash('${x.id}')">Wiederherstellen</button></div>`).join('')||'<p class="hint">Papierkorb ist leer.</p>'}${(db.trash||[]).length?'<button class="danger" onclick="emptyTrash()">Papierkorb leeren</button>':''}</div>`}
function actions(kind,id){return `<div class="row"><button class="secondary" onclick="editId='${id}';render()">Bearbeiten</button><button class="danger" onclick="del('${kind}','${id}')">Löschen</button></div>`}function noteGraph(){let a=filtered(db.notes),w=1000,h=650,positions={};a.forEach((n,i)=>{let angle=i*2.3999632297,r=55+Math.sqrt(i+1)*Math.min(70,360/Math.sqrt(Math.max(1,a.length)));positions[n.id]=n.nodePos&&Number.isFinite(n.nodePos.x)&&Number.isFinite(n.nodePos.y)?n.nodePos:{x:w/2+Math.cos(angle)*r,y:h/2+Math.sin(angle)*r}});let edges=a.flatMap(n=>(n.connections||[]).filter(id=>positions[id]&&n.id<id).map(id=>`<line data-edge-from="${n.id}" data-edge-to="${id}" x1="${positions[n.id].x}" y1="${positions[n.id].y}" x2="${positions[id].x}" y2="${positions[id].y}" stroke="#7085a6" stroke-width="2"/>`));return `<div class="panel"><p class="hint">Knoten mit Maus oder Finger verschieben. Antippen öffnet die Notiz. Positionen werden in Supabase gespeichert.</p><div class="graphscroll"><svg id="knowledgeGraph" viewBox="0 0 ${w} ${h}" role="group" aria-label="Verschiebbares Wissensnetzwerk">${edges.join('')}${a.map(n=>`<g class="knowledge-node" data-node-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title)}" transform="translate(${positions[n.id].x} ${positions[n.id].y})"><circle r="13" fill="${topicColor(n.category)}" stroke="#0b1527" stroke-width="3"/><text x="19" y="5" fill="#f2f6ff" font-size="14">${esc(n.title.slice(0,29))}</text></g>`).join('')}</svg></div>${noteLinkForm()}</div>`}
function setupNoteDrag(){const svg=document.getElementById('knowledgeGraph');if(!svg)return;let drag=null;function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let matrix=svg.getScreenCTM();return matrix?p.matrixTransform(matrix.inverse()):{x:0,y:0}}svg.querySelectorAll('.knowledge-node').forEach(g=>{g.style.cursor='grab';g.addEventListener('pointerdown',e=>{if(e.button!==0)return;let n=db.notes.find(x=>x.id===g.dataset.nodeId);if(!n)return;let p=point(e);let base=n.nodePos||{x:500,y:325};if(!n.nodePos){let tr=g.transform.baseVal.consolidate();if(tr)base={x:tr.matrix.e,y:tr.matrix.f}}drag={id:n.id,g,start:p,base,moved:false};g.setPointerCapture(e.pointerId);e.preventDefault()});g.addEventListener('pointermove',e=>{if(!drag||drag.g!==g)return;let p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>4)drag.moved=true;let x=Math.max(18,Math.min(900,drag.base.x+dx)),y=Math.max(20,Math.min(625,drag.base.y+dy));g.setAttribute('transform',`translate(${x} ${y})`);svg.querySelectorAll('line').forEach(l=>{if(l.dataset.edgeFrom===drag.id){l.setAttribute('x1',x);l.setAttribute('y1',y)}if(l.dataset.edgeTo===drag.id){l.setAttribute('x2',x);l.setAttribute('y2',y)}})});g.addEventListener('pointerup',e=>{if(!drag||drag.g!==g)return;let d=drag;drag=null;if(d.moved){let tr=g.transform.baseVal.consolidate(),n=db.notes.find(x=>x.id===d.id);if(n&&tr){n.nodePos={x:tr.matrix.e,y:tr.matrix.f};save()}}else{selectedNote=d.id;render()}});g.addEventListener('pointercancel',()=>drag=null);g.addEventListener('keydown',e=>{if(e.key==='Enter'){selectedNote=g.dataset.nodeId;render()}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let n=db.notes.find(x=>x.id===g.dataset.nodeId);let tr=g.transform.baseVal.consolidate();let p=n.nodePos||{x:tr.matrix.e,y:tr.matrix.f};n.nodePos={x:Math.max(18,Math.min(900,p.x+(e.key==='ArrowRight'?15:e.key==='ArrowLeft'?-15:0))),y:Math.max(20,Math.min(625,p.y+(e.key==='ArrowDown'?15:e.key==='ArrowUp'?-15:0)))};save();render()}})})}
const topicPalette=['#00E5FF','#FF4FC3','#B3FF33','#FFB000','#8A7DFF','#00F5A0','#FF5D5D','#4DA3FF','#F7F047','#E879FF','#FF8552','#50E0D1'];
function topicColor(topic){let h=2166136261;for(const ch of String(topic||'Ohne Projekt')){h=Math.imul(h^ch.charCodeAt(0),16777619)}return topicPalette[(h>>>0)%topicPalette.length]}
function topicStyle(topic){let c=topicColor(topic);return `border-left:6px solid ${c};background:linear-gradient(90deg,${c}30,transparent 85%);border-radius:9px;padding-left:12px`}
function unlinkNotes(a,b){let x=db.notes.find(n=>n.id===a),y=db.notes.find(n=>n.id===b);if(!x||!y)return;x.connections=(x.connections||[]).filter(id=>id!==b);y.connections=(y.connections||[]).filter(id=>id!==a);save();render()}
function noteLinkForm(){return `<div class="row" style="margin-top:15px;align-items:center"><label>Von <select id="linkFrom"><option value="">Wählen</option>${db.notes.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label><label>Mit <select id="linkTo"><option value="">Wählen</option>${db.notes.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label><button class="primary" onclick="connectNotes()">Verbinden</button></div>`}
function connectNotes(){let a=document.getElementById('linkFrom').value,b=document.getElementById('linkTo').value;if(!a||!b||a===b){alert('Bitte zwei unterschiedliche Einträge auswählen.');return}for(let [x,y] of [[a,b],[b,a]]){let n=db.notes.find(z=>z.id===x);n.connections=n.connections||[];if(!n.connections.includes(y))n.connections.push(y)}save();render()}
function notes(){let selected=db.notes.find(x=>x.id===selectedNote);return title('Wissensnetzwerk','Notizen bleiben verborgen, bis du einen Eintrag öffnest.')+toolbar('Notiz')+knowledgeTools()+`<div class="row viewtabs"><button class="secondary ${noteView==='graph'?'selected':''}" onclick="noteView='graph';render()">Netzwerk</button><button class="secondary ${noteView==='list'?'selected':''}" onclick="noteView='list';render()">Liste</button></div>`+(editId?noteForm():'')+(noteView==='graph'?noteGraph():`<div class="panel">${filtered(db.notes).map(x=>`<div class="item"><button class="secondary" onclick="selectedNote='${x.id}';render()">${esc(x.title)}</button> <span class="hint">${esc(x.category||'')}</span></div>`).join('')||empty()}</div>`)+(selected?`<div class="panel"><div class="row"><h3 style="flex:1">${esc(selected.title)}</h3><button class="secondary" onclick="selectedNote=null;render()">Schließen</button></div><p class="hint">${esc(selected.category||'')} ${tags(selected.tags)}</p><p style="white-space:pre-wrap">${esc(selected.content)}</p><h4>Verknüpft mit</h4>${(selected.connections||[]).map(id=>db.notes.find(x=>x.id===id)).filter(Boolean).map(n=>`<span class="row" style="display:inline-flex;gap:5px;margin:4px 6px 4px 0"><button class="secondary" onclick="selectedNote='${n.id}';render()">${esc(n.title)}</button><button class="danger" aria-label="Verbindung zu ${esc(n.title)} entfernen" title="Verbindung entfernen" onclick="unlinkNotes('${selected.id}','${n.id}')">×</button></span>`).join(' ')||'<span class="hint">Keine Verknüpfungen</span>'}<div style="margin-top:12px"><p class="hint">Zugeordnete Themen: ${noteTopicIds(selected.id).map(id=>esc(entityTitle('topicRecords',id))).join(', ')||'keine'}</p>${relationEditor('notes',selected.id)}${actions('notes',selected.id)}</div></div>`:'')}

// Knowledge Hub 2.0: distinct projects, hierarchical topics, cross-module links.
const linkableKinds=[['projectRecords','Projekt'],['topicRecords','Thema'],['notes','Wissen'],['tasks','Aufgabe'],['links','Quelle'],['cards','Lernkarte'],['diagrams','Diagramm'],['maps','Mindmap'],['sketches','Handschrift']];
function gcalEntityId(e){if(e._provider==='outlook')return 'outlook::'+e._accountId+'::'+e._calendarId+'::'+e.id;return e._calendarId+'::'+(e.recurringEventId?e.recurringEventId+'@'+(e.originalStartTime?.dateTime||e.originalStartTime?.date||e.id):e.id)}
function gcalRelationTitle(id){let e=gcalEvents.find(e=>gcalEntityId(e)===id);return e?.summary||db.relations.find(r=>(['gcal','outlook'].includes(r.fromType)&&r.fromId===id)||(['gcal','outlook'].includes(r.toType)&&r.toId===id))?.googleTitle||'Kalendertermin (nicht geladen)'}
function entityTitle(kind,id){if(kind==='gcal'||kind==='outlook')return gcalRelationTitle(id);let x=(db[kind]||[]).find(z=>z.id===id);return x?.title||x?.name||x?.front||null}
function relationsFor(kind,id){return db.relations.filter(r=>(r.fromType===kind&&r.fromId===id)||(r.toType===kind&&r.toId===id))}
function relatedTo(kind,id,targetKind){return relationsFor(kind,id).map(r=>r.fromType===kind&&r.fromId===id?{kind:r.toType,id:r.toId,r}:{kind:r.fromType,id:r.fromId,r}).filter(x=>!targetKind||x.kind===targetKind)}
function gcalEventRelations(e){return relationEditor(e._provider==='outlook'?'outlook':'gcal',gcalEntityId(e))}
function linkGoogleEvent(eventIndex,kind,id){const e=gcalEvents[eventIndex];if(!e||!entityTitle(kind,id))return;const eid=gcalEntityId(e),provider=e._provider==='outlook'?'outlook':'gcal';if(db.relations.some(r=>(['gcal','outlook'].includes(r.fromType)&&r.fromId===eid&&r.toType===kind&&r.toId===id)||(['gcal','outlook'].includes(r.toType)&&r.toId===eid&&r.fromType===kind&&r.fromId===id)))return alert('Bereits verknüpft.');db.relations.push({id:uid(),fromType:provider,fromId:eid,toType:kind,toId:id,label:'verknüpft mit',googleTitle:e.summary||'Ohne Titel',googleStart:e.start?.dateTime||e.start?.date||''});save();render()}
function linkGoogleEventSelected(kind){const el=document.getElementById('gcal-link-'+kind);if(el?.value)linkGoogleEvent(gcalDetail,kind,el.value)}
function gcalLinkSelector(kind,caption){return `<label>${caption}<select id="gcal-link-${kind}"><option value="">Bitte wählen …</option>${(db[kind]||[]).map(x=>`<option value="${esc(x.id)}">${esc(entityTitle(kind,x.id))}</option>`).join('')}</select></label><button class="secondary" onclick="linkGoogleEventSelected('${kind}')">Verknüpfen</button>`}
function taskFromGoogleEvent(){const e=gcalEvents[gcalDetail];if(!e)return;const title=prompt('Neue Aufgabe zu diesem Termin:', 'Vorbereitung: '+(e.summary||'Termin'));if(!title?.trim())return;const due=e.start?.date||e.start?.dateTime?.slice(0,10)||'';const task={id:uid(),title:title.trim(),category:'',due,done:false,repeat:'never',notes:'Bezug: '+(e.summary||'Kalendertermin')};db.tasks.unshift(task);const eid=gcalEntityId(e);db.relations.push({id:uid(),fromType:e._provider==='outlook'?'outlook':'gcal',fromId:eid,toType:'tasks',toId:task.id,label:'Aufgabe zum Termin',googleTitle:e.summary||'Ohne Titel',googleStart:e.start?.dateTime||e.start?.date||''});save();alert('Aufgabe angelegt und mit dem Kalendertermin verknüpft.');render()}
function googleRelationsForProject(projectId){const ids=new Set([...relatedTo('projectRecords',projectId,'gcal'),...relatedTo('projectRecords',projectId,'outlook')].map(x=>x.id));for(const x of relatedTo('projectRecords',projectId,'tasks'))for(const t of [...relatedTo('tasks',x.id,'gcal'),...relatedTo('tasks',x.id,'outlook')])ids.add(t.id);return [...ids].map(id=>({id,title:gcalRelationTitle(id),r:db.relations.find(r=>(['gcal','outlook'].includes(r.fromType)&&r.fromId===id)||(['gcal','outlook'].includes(r.toType)&&r.toId===id))})).filter(x=>x.r)}
function projectOverview(id){const kinds=[['tasks','Aufgaben'],['notes','Wissenseinträge'],['links','Quellen'],['topicRecords','Themen']];return `<div class="panel"><h4>Projekt-Arbeitsbereich</h4>${kinds.map(([kind,label])=>{const items=relatedTo('projectRecords',id,kind);return `<h4>${label} (${items.length})</h4>${items.map(x=>`<button class="secondary" style="margin:3px" onclick="openEntity('${kind}','${x.id}')">${esc(entityTitle(kind,x.id)||'Eintrag')}</button>`).join('')||'<p class="hint">Noch keine Zuordnung</p>'}`}).join('')}<h4>Kalendertermine</h4>${googleRelationsForProject(id).map(x=>`<div class="item"><span>📅 ${esc(x.title)}</span> <span class="hint">${esc((x.r.googleStart||'').slice(0,10))}</span></div>`).join('')||'<p class="hint">Noch keine Termine zugeordnet.</p>'}</div>`}

function entityOptions(){return linkableKinds.flatMap(([kind,label])=>(db[kind]||[]).map(x=>({kind,label,id:x.id,title:entityTitle(kind,x.id)}))).filter(x=>x.title)}
function relationEditor(kind,id){let related=relationsFor(kind,id);let options=entityOptions().filter(x=>!(x.kind===kind&&x.id===id));return `<div class="panel" style="padding:12px"><h4>Verknüpfungen (${related.length})</h4>${related.map(r=>{let reverse=r.fromType===kind&&r.fromId===id,k=reverse?r.toType:r.fromType,i=reverse?r.toId:r.fromId,n=entityTitle(k,i),label=linkableKinds.find(v=>v[0]===k)?.[1]||k;return n?`<div class="row" style="margin:5px 0"><button class="secondary" onclick="openEntity('${k}','${i}')">${esc(label)}: ${esc(n)}</button><span class="hint">${esc(r.label)}</span><button class="danger" onclick="removeRelation('${r.id}')">×</button></div>`:''}).join('')||'<p class="hint">Noch keine Verknüpfungen.</p>'}<div class="row"><select id="relationTarget-${kind}-${id}" style="flex:1;min-width:180px"><option value="">Eintrag verknüpfen …</option>${options.map(x=>`<option value="${esc(x.kind+'|'+x.id)}">${esc(x.label)} · ${esc(x.title)}</option>`).join('')}</select><button class="secondary" onclick="addRelation('${kind}','${id}')">Verbinden</button></div></div>`}
function addRelation(kind,id){let v=document.getElementById('relationTarget-'+kind+'-'+id)?.value;if(!v)return;let [k,i]=v.split('|');if(!entityTitle(k,i))return;let exists=db.relations.some(r=>(r.fromType===kind&&r.fromId===id&&r.toType===k&&r.toId===i)||(r.fromType===k&&r.fromId===i&&r.toType===kind&&r.toId===id));if(exists)return alert('Diese Verbindung existiert bereits.');db.relations.push({id:uid(),fromType:kind,fromId:id,toType:k,toId:i,label:'verknüpft mit'});save();render()}
function removeRelation(id){db.relations=db.relations.filter(r=>r.id!==id);save();render()}
function openEntity(kind,id){if(kind==='notes'){selectedNote=id;go('notes')}else if(kind==='tasks'){taskOpen=id;taskView='all';go('tasks')}else if(kind==='gcal'||kind==='outlook'){let i=gcalEvents.findIndex(e=>gcalEntityId(e)===id);if(i>=0){gcalDetail=i;taskView='calendar';go('tasks')}else alert('Dieser Kalendertermin ist momentan nicht geladen. Öffne den entsprechenden Zeitraum im Kalender.')}else if(kind==='projectRecords'||kind==='topicRecords'){detailEntity=id;go(kind)}else{go(kind);editId=id;render()}}

function nextRepeatDate(iso,frequency){
  const [y,m,d]=iso.split('-').map(Number);let date=new Date(Date.UTC(y,m-1,d));
  if(frequency==='daily')date.setUTCDate(date.getUTCDate()+1);
  else if(frequency==='weekly')date.setUTCDate(date.getUTCDate()+7);
  else if(frequency==='monthly'){
    let first=new Date(Date.UTC(y,m,1));
    let last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
    date=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),Math.min(d,last)));
  }
  return date.toISOString().slice(0,10);
}

async function loadCloudSketches(){let rows=await cloudRequest('/rest/v1/kh_handwritten_notes?select=*');let result=[];for(let x of rows){if(!x.storage_path)continue;try{let r=await sketchApi('/storage/v1/object/authenticated/kh-sketches/'+x.storage_path);let blob=await r.blob();let data=await new Promise((resolve,reject)=>{let f=new FileReader();f.onload=()=>resolve(f.result);f.onerror=reject;f.readAsDataURL(blob)});result.push({id:x.id,title:x.title,data})}catch(e){console.warn('Handschrift konnte nicht geladen werden',x.id,e)}}return result}
async function deleteCloudSketch(id){let user=await cloudRequest('/auth/v1/user');let path=user.id+'/'+id+'.png';await sketchApi('/storage/v1/object/kh-sketches/'+path,{method:'DELETE'});await cloudRequest('/rest/v1/kh_handwritten_notes?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
async function cloudLogin(email,password){let r=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Anmeldung fehlgeschlagen');cloudSession=d;sessionStorage.setItem(CLOUD_TOKEN_KEY,JSON.stringify(d));await cloudLoad()}
async function refreshCloudToken(){if(!cloudSession?.refresh_token)throw Error('Bitte erneut anmelden');let r=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});let d=await r.json();if(!r.ok)throw Error('Sitzung abgelaufen. Bitte erneut anmelden.');cloudSession=d;sessionStorage.setItem(CLOUD_TOKEN_KEY,JSON.stringify(d))}
async function ensureToken(){if(cloudSession?.expires_at && Date.now()/1000>cloudSession.expires_at-90)await refreshCloudToken()}
async function cloudLoad(){statusText('Lade Cloud-Daten …');await ensureToken();let next=structuredClone(initial);for(const k of Object.keys(next))next[k]=[];for(const [kind,spec] of Object.entries(cloudSpecs)){const rows=await cloudRequest('/rest/v1/'+spec.table+'?select=*');next[kind]=rows.map(spec.from)}// Nicht synchronisierte Module bleiben lokal, werden nie als Cloud-Sicherung bezeichnet.
// Hub 2.0: Projekte, Themen und Verknüpfungen werden jetzt geräteübergreifend synchronisiert.
 const hubKinds=['projectRecords','topicRecords','relations'];
 const hubRows=await cloudRequest('/rest/v1/kh_hub_entities_v2?select=kind,id,payload');
 const remoteMarks=hubRows.filter(r=>r.kind==='relations'&&r.payload?.__khDeleted===true).map(r=>r.payload.mark).filter(Boolean);next.deletedMarks=[...remoteMarks,...(db.deletedMarks||[]).filter(x=>!remoteMarks.some(y=>y.kind===x.kind&&y.originalId===x.originalId))];
 const remoteHabitMeta=hubRows.filter(r=>r.kind==='relations'&&r.payload?.__khHabitMeta===true).map(r=>r.payload);
 const remoteTrash=hubRows.filter(r=>r.kind==='relations'&&r.payload?.__khTrash===true).map(r=>r.payload.entry).filter(Boolean);
 next.trash=[...remoteTrash,...(db.trash||[]).filter(x=>!remoteTrash.some(y=>y.id===x.id))];
 for(const kind of hubKinds){const remote=hubRows.filter(r=>r.kind===kind&&r.payload?.__khTrash!==true&&r.payload?.__khDeleted!==true&&r.payload?.__khHabitMeta!==true).map(r=>r.payload);next[kind]=remote.length?remote:(db[kind]||[])}
  for(const meta of remoteHabitMeta){const h=next.habits.find(x=>x.id===meta.habitId);if(h){h.color=meta.color||h.color;h.order=meta.order}}next.habits.sort((a,b)=>(a.order??999999)-(b.order??999999));
 for(const entry of [...(next.trash||[]),...(next.deletedMarks||[])]){if(Array.isArray(next[entry.kind]))next[entry.kind]=next[entry.kind].filter(x=>x.id!==entry.originalId)}
 next.diagrams=db.diagrams||[];next.sketches=db.sketches||[];const cloudSketches=await loadCloudSketches();next.sketches=[...cloudSketches,...next.sketches.filter(x=>!cloudSketches.some(y=>y.id===x.id))];db=next;cloudLoaded=true;localStorage.setItem(KEY,JSON.stringify(db));document.body.classList.remove('locked');document.getElementById('logoutButton').style.display='inline-block';statusText('Cloud verbunden · Handschrift synchronisiert');render();await loadAnnotations()}
function scheduleCloudSave(){if(!cloudLoaded)return;cloudDirty=true;statusText('Speichere …');clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSync,700)}
async function cloudSync(){if(cloudBusy||!cloudDirty)return;cloudBusy=true;cloudDirty=false;try{await ensureToken();const user=await cloudRequest('/auth/v1/user');// Save linked entities without deleting other devices' data automatically.
 const hubKinds=['projectRecords','topicRecords','relations'];
 const hubRows=hubKinds.flatMap(kind=>(db[kind]||[]).map(x=>({id:x.id,kind,user_id:user.id,payload:x})));
 // Papierkorb als markierte Datensaetze der erlaubten Kategorie 'relations' speichern.
 // Die Datenbank-Constraint erlaubt keinen neuen kind-Wert 'trash'.
 hubRows.push(...(db.deletedMarks||[]).map(x=>({id:'deleted-'+x.kind+'-'+x.originalId,kind:'relations',user_id:user.id,payload:{__khDeleted:true,mark:x}})));
 hubRows.push(...(db.habits||[]).map((x,i)=>({id:'habitmeta-'+x.id,kind:'relations',user_id:user.id,payload:{__khHabitMeta:true,habitId:x.id,color:habitColor(x),order:i}})));
 hubRows.push(...(db.trash||[]).map(x=>({id:x.id,kind:'relations',user_id:user.id,payload:{__khTrash:true,entry:x}})));
 if(hubRows.length)await cloudRequest('/rest/v1/kh_hub_entities_v2?on_conflict=user_id,kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(hubRows)});
  const savedTrashRows=await cloudRequest('/rest/v1/kh_hub_entities_v2?kind=eq.relations&select=id,payload');const currentTrash=new Set((db.trash||[]).map(x=>x.id));for(const t of savedTrashRows||[])if(t.payload?.__khTrash===true&&!currentTrash.has(t.id))await cloudRequest('/rest/v1/kh_hub_entities_v2?kind=eq.relations&id=eq.'+encodeURIComponent(t.id),{method:'DELETE'});
  for(const entry of [...(db.trash||[]),...(db.deletedMarks||[])]){const spec=cloudSpecs[entry.kind];if(spec)await cloudRequest('/rest/v1/'+spec.table+'?id=eq.'+encodeURIComponent(entry.originalId),{method:'DELETE'});else if(['projectRecords','topicRecords','relations'].includes(entry.kind))await cloudRequest('/rest/v1/kh_hub_entities_v2?kind=eq.'+encodeURIComponent(entry.kind)+'&id=eq.'+encodeURIComponent(entry.originalId),{method:'DELETE'})}
 for(const [kind,spec] of Object.entries(cloudSpecs)){let rows=db[kind].map(x=>({...spec.to(x),user_id:user.id}));let existing=await cloudRequest('/rest/v1/'+spec.table+'?select=id');let ids=new Set(rows.map(x=>x.id));let removed=existing.filter(x=>!ids.has(x.id)).map(x=>x.id);if(rows.length)await cloudRequest('/rest/v1/'+spec.table+'?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});/* Sicherheit: kein automatisches Massenloeschen beim Synchronisieren. */}statusText('Cloud gespeichert')}catch(e){cloudDirty=true;statusText('⚠ Cloud-Speicherung fehlgeschlagen');alert('Cloud-Speicherung fehlgeschlagen. Änderungen sind vorläufig nur lokal. Bitte JSON-Backup exportieren.\n'+e.message)}finally{cloudBusy=false;if(cloudDirty)statusText('⚠ Nicht vollständig synchronisiert')}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;document.getElementById('loginError').textContent='';try{let f=new FormData(e.target);await cloudLogin(f.get('email'),f.get('password'))}catch(err){document.getElementById('loginError').textContent=err.message;statusText('Nicht angemeldet')}finally{b.disabled=false}});
document.getElementById('logoutButton').addEventListener('click',()=>{clearTimeout(cloudTimer);if(cloudDirty){alert('Noch nicht synchronisierte Änderungen. Bitte zuerst eine Sicherung exportieren.');return}cloudSession=null;cloudLoaded=false;sessionStorage.removeItem(CLOUD_TOKEN_KEY);document.body.classList.add('locked');document.getElementById('logoutButton').style.display='none';statusText('Abgemeldet')});
(async()=>{try{let old=sessionStorage.getItem(CLOUD_TOKEN_KEY);if(old){cloudSession=JSON.parse(old);await cloudLoad()}}catch(e){cloudSession=null;sessionStorage.removeItem(CLOUD_TOKEN_KEY);statusText('Bitte anmelden')}})();


// Microsoft 365: delegated, read-only Graph API. Access tokens stay in MSAL session storage.
const OUTLOOK_CLIENT_ID='7c2b7fc2-6567-47c2-ab21-89cd873b0d3e';
const OUTLOOK_TENANT_ID='1f55450c-e358-4c7f-a059-a49e044f5622';
const OUTLOOK_REDIRECT='https://mlanghans1789.github.io/KnowledgeBase/';
const OUTLOOK_SCOPES=['Calendars.Read'];
let outlookMsal=null,outlookAccounts=[],outlookCalendars=[],outlookError='',outlookLoading=false,outlookReady=null;
let outlookSelected=(()=>{try{return JSON.parse(localStorage.getItem('kh-outlook-selected-v1'))||{}}catch{return {}}})();
function outlookSaveSelected(){localStorage.setItem('kh-outlook-selected-v1',JSON.stringify(outlookSelected))}
function outlookScript(){return new Promise((resolve,reject)=>{if(window.msal?.PublicClientApplication)return resolve();let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js';script.onload=resolve;script.onerror=()=>reject(Error('Microsoft-Anmeldebibliothek konnte nicht geladen werden.'));document.head.appendChild(script)})}
async function outlookInit(){if(outlookMsal)return outlookMsal;if(outlookReady)return outlookReady;outlookReady=(async()=>{await outlookScript();const instance=new msal.PublicClientApplication({auth:{clientId:OUTLOOK_CLIENT_ID,authority:'https://login.microsoftonline.com/'+OUTLOOK_TENANT_ID,redirectUri:OUTLOOK_REDIRECT,navigateToLoginRequestUrl:false},cache:{cacheLocation:'sessionStorage',storeAuthStateInCookie:false}});await instance.handleRedirectPromise();outlookMsal=instance;outlookAccounts=instance.getAllAccounts();return instance})().catch(e=>{outlookReady=null;throw e});return outlookReady}
async function outlookConnect(){try{const app=await outlookInit();await app.loginPopup({scopes:OUTLOOK_SCOPES,prompt:'select_account'});outlookAccounts=app.getAllAccounts();outlookError='';await outlookLoadCalendars();await gcalLoadEvents()}catch(e){outlookError=e.message||String(e);render()}}
async function outlookToken(account){const app=await outlookInit();try{return (await app.acquireTokenSilent({scopes:OUTLOOK_SCOPES,account})).accessToken}catch(e){if(e instanceof msal.InteractionRequiredAuthError){outlookError='Microsoft-Sitzung benötigt erneute Anmeldung. Bitte „Microsoft verbinden“ auswählen.';throw Error(outlookError)}throw e}}
async function outlookGraph(path,account){const token=await outlookToken(account);const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);try{const r=await fetch(path.startsWith('https://')?path:'https://graph.microsoft.com/v1.0'+path,{headers:{Authorization:'Bearer '+token,Prefer:'outlook.timezone="UTC"'},signal:ctrl.signal});if(!r.ok){let msg='';try{const body=await r.json();msg=body.error?.message||''}catch{}throw Error('Outlook: HTTP '+r.status+(msg?' – '+msg:''))}return await r.json()}finally{clearTimeout(timer)}}
async function outlookLoadCalendars(){if(!outlookAccounts.length)return;outlookLoading=true;try{const results=await Promise.allSettled(outlookAccounts.map(async a=>{let url='/me/calendars?$select=id,name,color,canEdit&$top=100',out=[];while(url&&out.length<300){let r=await outlookGraph(url,a);out.push(...(r.value||[]));url=r['@odata.nextLink']||''}return out.map(c=>({...c,_accountId:a.homeAccountId,_accountName:a.username,_key:a.homeAccountId+'::'+c.id}))}));outlookCalendars=results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value);outlookError=results.filter(r=>r.status==='rejected').map(r=>r.reason?.message||String(r.reason)).join(' | ');for(const c of outlookCalendars)if(!(c._key in outlookSelected))outlookSelected[c._key]=true;outlookSaveSelected()}catch(e){outlookError=e.message}finally{outlookLoading=false;render()}}
async function outlookLoadEvents(start,end){if(!outlookAccounts.length)return [];if(!outlookCalendars.length)await outlookLoadCalendars();const calendars=outlookCalendars.filter(c=>outlookSelected[c._key]);const results=await Promise.allSettled(calendars.map(async c=>{const account=outlookAccounts.find(a=>a.homeAccountId===c._accountId);if(!account)return [];let url='/me/calendars/'+encodeURIComponent(c.id)+'/calendarView?startDateTime='+encodeURIComponent(start)+'&endDateTime='+encodeURIComponent(end)+'&$top=100&$select=id,subject,start,end,isAllDay,location,bodyPreview,webLink,seriesMasterId,type,isCancelled';let events=[];while(url&&events.length<600){const data=await outlookGraph(url,account);events.push(...(data.value||[]).filter(e=>!e.isCancelled).map(e=>{const st=e.start?.dateTime,et=e.end?.dateTime;const normalize=v=>v?(v.endsWith('Z')?v:v+'Z'):'';return {id:e.id,summary:e.subject||'Ohne Titel',start:e.isAllDay?{date:st?.slice(0,10)}:{dateTime:normalize(st)},end:e.isAllDay?{date:et?.slice(0,10)}:{dateTime:normalize(et)},location:e.location?.displayName||'',description:e.bodyPreview||'',htmlLink:e.webLink||'',_provider:'outlook',_accountId:c._accountId,_calendarId:c.id,_calendarName:c.name+' · '+c._accountName}}));url=data['@odata.nextLink']||''}return events}));const failures=results.filter(r=>r.status==='rejected');outlookError=failures.map(r=>r.reason?.message||String(r.reason)).join(' | ');return results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value)}
function outlookToggle(key,checked){outlookSelected[key]=checked;outlookSaveSelected();gcalLoadEvents()}
async function outlookDisconnect(){try{const app=await outlookInit();const account=outlookAccounts[0];if(account)await app.logoutPopup({account,mainWindowRedirectUri:location.href})}catch(e){outlookError=e.message}outlookAccounts=[];outlookCalendars=[];gcalLoadEvents()}
function outlookCalendarControls(){return `<div class="gcal-panel"><div class="row"><strong>Outlook / Microsoft 365 (nur lesen)</strong><button class="primary" onclick="outlookConnect()">${outlookAccounts.length?'Microsoft erneut verbinden':'+ Microsoft-Konto verbinden'}</button>${outlookAccounts.length?'<button class="secondary" onclick="outlookLoadCalendars().then(()=>gcalLoadEvents())">Aktualisieren</button><button class="secondary" onclick="outlookDisconnect()">Trennen</button>':''}</div>${outlookError?`<p role="alert" style="color:#ffb4b4">${esc(outlookError)}</p>`:''}${outlookLoading?'<p class="hint">Outlook-Kalender werden geladen …</p>':''}${outlookAccounts.map(a=>`<p class="hint">Verbunden: ${esc(a.username)}</p>`).join('')}<div class="row">${outlookCalendars.map(c=>`<label class="gcal-chip"><input type="checkbox" ${outlookSelected[c._key]?'checked':''} onchange="outlookToggle(decodeURIComponent('${encodeURIComponent(c._key)}'),this.checked)">${esc(c.name)}</label>`).join('')}</div><p class="hint">Bei abgelaufener Anmeldung ist möglicherweise eine erneute Microsoft-Anmeldung nötig. Es werden keine Termine verändert.</p></div>`}
function outlookSettings(){return `<div class="panel"><h3>Microsoft 365 / Outlook</h3><p class="hint">Dienstlicher Outlook-Kalender, ausschließlich Calendars.Read. Client-ID und Tenant-ID sind bereits hinterlegt. Keine geheimen Schlüssel im Browser.</p>${outlookCalendarControls()}</div>`}
// Periodic refresh while the app is visible. Google tokens are not silently renewable with this OAuth flow.
setInterval(()=>{if(document.visibilityState==='visible'&&cloudLoaded&&page==='tasks'&&taskView==='calendar'&&(Object.keys(gcalAccounts).length||outlookAccounts.length))gcalLoadEvents()},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudLoaded&&page==='tasks'&&taskView==='calendar'&&(Object.keys(gcalAccounts).length||outlookAccounts.length))gcalLoadEvents()});
outlookInit().then(()=>{if(outlookAccounts.length)outlookLoadCalendars().then(()=>{if(page==='tasks'&&taskView==='calendar')gcalLoadEvents()})}).catch(e=>{outlookError=e.message;console.warn('Microsoft-Anmeldung:',e.message)});
