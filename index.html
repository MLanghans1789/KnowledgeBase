'notes',fromId:savedId,toType:a.kind,toId:a.id,label:'angeheftet an'});window.khPendingAttachment=null}}editId=null;save();render()}function del(kind,id){if(kind==='notes'){db.notes.forEach(n=>n.connections=(n.connections||[]).filter(v=>v!==id));if(selectedNote===id)selectedNote=null;}if(confirm('Eintrag wirklich löschen?')){db.relations=db.relations.filter(r=>!(r.fromType===kind&&r.fromId===id)&&!(r.toType===kind&&r.toId===id));const removed=db[kind].find(x=>x.id===id);if(removed){db.trash=db.trash||[];db.trash.unshift({id:uid(),kind,originalId:id,item:structuredClone(removed),deletedAt:new Date().toISOString()});db.deletedMarks=db.deletedMarks||[];if(!db.deletedMarks.some(x=>x.kind===kind&&x.originalId===id))db.deletedMarks.push({kind,originalId:id,deletedAt:new Date().toISOString()})}db[kind]=db[kind].filter(x=>x.id!==id);save();render()}}function restoreTrash(id){const entry=(db.trash||[]).find(x=>x.id===id);if(!entry)return;db[entry.kind]=db[entry.kind]||[];if(db[entry.kind].some(x=>x.id===entry.originalId)){alert('Eintrag existiert bereits.');return}db[entry.kind].unshift(structuredClone(entry.item));if(entry.kind==='appointments')db.appointments[0]._restorePending=true;db.trash=db.trash.filter(x=>x.id!==id);db.deletedMarks=(db.deletedMarks||[]).filter(x=>!(x.kind===entry.kind&&x.originalId===entry.originalId));save();render()}

function noteGraph(){
 const allNodes=[...filtered(db.notes).map(x=>({...x,kind:'notes',label:x.title})),...filtered(db.topicRecords).map(x=>({...x,kind:'topicRecords',label:x.title})),...filtered(db.projectRecords).map(x=>({...x,kind:'projectRecords',label:x.title}))];
 const choices=[...db.topicRecords.map(x=>({kind:'topicRecords',...x})),...db.projectRecords.map(x=>({kind:'projectRecords',...x}))];

   if(kind==='topicRecords'&&khGraphExpanded.has(key))for(const t of db.topicRecords){if(khTopicParentId(t)===id){const child='topicRecords|'+t.id;allowed.add(child);queue.push(child)}}
   if(key===khGraphFocus||khGraphExpanded.has(key)){
    for(const r of db.relations||[]){let other=null;if(r.fromType===kind&&r.fromId===id)other=r.toType+'|'+r.toId;else if(r.toType===kind&&r.toId===id)other=r.fromType+'|'+r.fromId;

 }
 const nodes=allowed?allNodes.filter(n=>allowed.has(n.kind+'|'+n.id)):allNodes;

 const add=(a,b,type)=>{if(!keys.has(a)||!keys.has(b)||a===b)return;const key=[a,b].sort().join('~');if(seen.has(key))return;seen.add(key);edges.push({a,b,type})};

 const W=1100,H=730;const positions={};const groups={notes:[],topicRecords:[],projectRecords:[]};nodes.forEach(n=>groups[n.kind].push(n));

 for(const [kind,arr] of Object.entries(groups))arr.forEach((n,i)=>{const a=i*2.3999632297,r=55+Math.sqrt(i+1)*Math.min(62,280/Math.sqrt(Math.max(1,arr.length))),center=centers[kind],p=n.nodePos&&Number.isFinite(n.nodePos.x)&&Number.isFinite(n.nodePos.y)?n.nodePos:{x:center[0]+Math.cos(a)*r,y:center[1]+Math.sin(a)*r};positions[kind+'|'+n.id]={x:Math.max(25,Math.min(W-160,p.x)),y:Math.max(25,Math.min(H-25,p.y))}});

 const lines=edges.map(e=>{const a=positions[e.a],b=positions[e.b],stroke=e.type==='hierarchy'?'#45d5ac':e.type==='notes'?'#65a9ff':'#b6a2e3';return `<line data-a="${esc(e.a)}" data-b="${esc(e.b)}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-width="${e.type==='hierarchy'?2.6:1.8}" stroke-opacity=".68" ${e.type==='relation'?'stroke-dasharray="5 4"':''}/>`}).join('');
 const dots=nodes.map(n=>{const key=n.kind+'|'+n.id,p=positions[key],c=colors[n.kind],radius=n.kind==='projectRecords'?16:n.kind==='topicRecords'?13:10;return `<g class="kh-graph-node" data-key="${esc(key)}" tabindex="0" role="button" aria-label="${esc(n.kind==='notes'?'Wissen':n.kind==='topicRecords'?'Thema':'Projekt')}: ${esc(n.label)}" transform="translate(${p.x} ${p.y})"><circle r="${radius}" fill="${c}" stroke="#0b1527" stroke-width="3"/><text x="${radius+7}" y="5" fill="#eaf2ff" font-size="13">${esc(String(n.label||'').slice(0,33))}</text></g>`}).join('');
 const controls=`<div class="row" style="margin-bottom:12px"><label style="flex:1;min-width:210px">Netzwerk anzeigen <select onchange="khSetGraphFocus(this.value)"><option value="">Gesamtes Netzwerk</option>${choices.map(x=>`<option value="${esc(x.kind+'|'+x.id)}" ${khGraphFocus===x.kind+'|'+x.id?'selected':''}>${x.kind==='topicRecords'?'◇ Thema':'◈ Projekt'}: ${esc(x.title)}</option>`).join('')}</select></label>${focus?`<button class="secondary" onclick="khGraphExpandAll()">Alle aufklappen</button><button class="secondary" onclick="khGraphCollapseAll()">Alle zuklappen</button>`:''}</div>`;
 const branches=focus?`<div class="panel" style="padding:12px"><strong>Teilnetzwerk: ${esc(focus.title)}</strong><p class="hint">Mit + Unterthemen und zugeordnete Einträge einblenden, mit − wieder ausblenden. Punkte antippen, um Details zu öffnen.</p><div class="row">${nodes.filter(n=>n.kind!=='notes').map(n=>{const key=n.kind+'|'+n.id;return `<button class="secondary" onclick="khToggleGraphBranch('${esc(key)}')">${khGraphExpanded.has(key)?'−':'+'} ${esc(n.label)}</button>`}).join('')}</div></div>`:'';
 return `<div class="panel">${controls}${branches}<div class="kh-legend"><span><i style="background:${colors.notes}"></i> Wissen</span><span><i style="background:${colors.topicRecords}"></i> Themen</span><span><i style="background:${colors.projectRecords}"></i> Projekte</span><span class="hint">Gestrichelt: Verknüpfungen · Grün: Themenhierarchie</span></div><p class="hint">Punkte verschieben oder antippen, um Einträge zu öffnen. Positionen werden gespeichert.</p><div class="graphscroll"><svg id="knowledgeGraph" viewBox="0 0 ${W} ${H}" role="group" aria-label="Wissensnetzwerk mit Wissen, Themen und Projekten">${lines}${dots}</svg></div>${noteLinkForm()}</div>`
}
function setupNoteDrag(){const svg=document.getElementById('knowledgeGraph');if(!svg)return;let drag=null;const point=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}};svg.querySelectorAll('.kh-graph-node').forEach(g=>{const [kind,id]=g.dataset.key.split('|');g.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const tr=g.transform.baseVal.consolidate();if(!tr)return;drag={g,key:g.dataset.key,kind,id,start:point(e),base:{x:tr.matrix.e,y:tr.matrix.f},moved:false};g.setPointerCapture(e.pointerId);e.preventDefault()});g.addEventListener('pointermove',e=>{if(!drag||drag.g!==g)return;const p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>5)drag.moved=true;const x=Math.max(25,Math.min(940,drag.base.x+dx)),y=Math.max(25,Math.min(700,drag.base.y+dy));g.setAttribute('transform',`translate(${x} ${y})`);svg.querySelectorAll('line').forEach(l=>{if(l.dataset.a===drag.key){l.setAttribute('x1',x);l.setAttribute('y1',y)}if(l.dataset.b===drag.key){l.setAttribute('x2',x);l.setAttribute('y2',y)}})});g.addEventListener('pointerup',()=>{if(!drag||drag.g!==g)return;const d=drag;drag=null;if(d.moved){const tr=g.transform.baseVal.consolidate(),item=(db[d.kind]||[]).find(x=>x.id===d.id);if(item&&tr){item.nodePos={x:tr.matrix.e,y:tr.matrix.f};save()}}else{if(d.kind==='notes'){selectedNote=d.id;render()}else openEntity(d.kind,d.id)}});g.addEventListener('pointercancel',()=>drag=null);g.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(kind==='notes'){selectedNote=id;render()}else openEntity(kind,id)}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const item=(db[kind]||[]).find(x=>x.id===id),tr=g.transform.baseVal.consolidate();if(!item||!tr)return;item.nodePos={x:Math.max(25,Math.min(940,tr.matrix.e+(e.key==='ArrowRight'?15:e.key==='ArrowLeft'?-15:0))),y:Math.max(25,Math.min(700,tr.matrix.f+(e.key==='ArrowDown'?15:e.key==='ArrowUp'?-15:0)))};save();render()}})})}

function noteLinkForm(){return `<div class="row" style="margin-top:15px;align-items:center"><label>Von <select id="linkFrom"><option value="">Wählen</option>${db.notes.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label><label>Mit <select id="linkTo"><option value="">Wählen</option>${db.notes.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select></label><button class="primary" onclick="connectNotes()">Verbinden</button></div>`}
function connectNotes(){let a=document.getElementById('linkFrom').value,b=document.getElementById('linkTo').value;if(!a||!b||a===b){alert('Bitte zwei unterschiedliche Einträge auswählen.');return}for(let [x,y] of [[a,b],[b,a]]){let n=db.notes.find(z=>z.id===x);n.connections=n.connections||[];if(!n.connections.includes(y))n.connections.push(y)}save();render()}
function notes(){let selected=db.notes.find(x=>x.id===selectedNote);return title('Wissensnetzwerk','Notizen bleiben verborgen, bis du einen Eintrag öffnest.')+toolbar('Notiz')+knowledgeTools()+`<div class="row viewtabs"><button class="secondary ${noteView==='graph'?'selected':''}" onclick="noteView='graph';render()">Netzwerk</button><button class="secondary ${noteView==='list'?'selected':''}" onclick="noteView='list';render()">Liste</button></div>`+(editId?noteForm():'')+(noteView==='graph'?noteGraph():`<div class="panel">${filtered(db.notes).map(x=>`<div class="item"><button class="secondary" onclick="selectedNote='${x.id}';render()">${esc(x.title)}</button> <span class="hint">${esc(x.category||'')}</span></div>`).join('')||empty()}</div>`)+(selected?`<div class="panel"><div class="row"><h3 style="flex:1">${esc(selected.title)}</h3><button class="secondary" onclick="selectedNote=null;render()">Schließen</button></div><p class="hint">${esc(selected.category||'')} ${tags(selected.tags)}</p>${selected.labels?`<div class="cal-event-labels">${labelBadges(selected.labels)}</div>`:''}<div class="kh-rich-display">${khNoteDisplay(selected.content)}</div><h4>Verknüpft mit</h4>${(selected.connections||[]).map(id=>db.notes.find(x=>x.id===id)).filter(Boolean).map(n=>`<span class="row" style="display:inline-flex;gap:5px;margin:4px 6px 4px 0"><button class="secondary" onclick="selectedNote='${n.id}';render()">${esc(n.title)}</button><button class="danger" aria-label="Verbindung zu ${esc(n.title)} entfernen" title="Verbindung entfernen" onclick="unlinkNotes('${selected.id}','${n.id}')">×</button></span>`).join(' ')||'<span class="hint">Keine Verknüpfungen</span>'}<div style="margin-top:12px"><p class="hint">Zugeordnete Themen: ${noteTopicIds(selected.id).map(id=>esc(entityTitle('topicRecords',id))).join(', ')||'keine'}</p>${relationEditor('notes',selected.id)}${actions('notes',selected.id)}</div></div>`:'')}

// Knowledge Hub 2.0: distinct projects, hierarchical topics, cross-module links.
const linkableKinds=[['projectRecords','Projekt'],['topicRecords','Thema'],['notes','Wissen'],['tasks','Aufgabe'],['appointments','Termin'],['links','Quelle'],['cards','Lernkarte'],['diagrams','Diagramm'],['maps','Mindmap'],['sketches','Handschrift']];
function gcalEntityId(e){if(e._provider==='outlook-ics')return 'ics::'+encodeURIComponent(JSON.stringify([e._calendarId,e.id])).replace(/'/g,'%27');if(e._provider==='outlook')return 'outlook::'+e._accountId+'::'+e._calendarId+'::'+e.id;return e._calendarId+'::'+(e.recurringEventId?e.recurringEventId+'@'+(e.originalStartTime?.dateTime||e.originalStartTime?.date||e.id):e.id)}
function gcalRelationTitle(id){let e=gcalEvents.find(e=>gcalEntityId(e)===id);return e?.summary||db.relations.find(r=>(['gcal','outlook'].includes(r.fromType)&&r.fromId===id)||(['gcal','outlook'].includes(r.toType)&&r.toId===id))?.googleTitle||'Kalendertermin (nicht geladen)'}
function entityTitle(kind,id){if(kind==='gcal'||kind==='outlook')return gcalRelationTitle(id);let x=(db[kind]||[]).find(z=>z.id===id);return x?.title||x?.name||x?.front||null}
function relationsFor(kind,id){return db.relations.filter(r=>(r.fromType===kind&&r.fromId===id)||(r.toType===kind&&r.toId===id))}
function relatedTo(kind,id,targetKind){return relationsFor(kind,id).map(r=>r.fromType===kind&&r.fromId===id?{kind:r.toType,id:r.toId,r}:{kind:r.fromType,id:r.fromId,r}).filter(x=>!targetKind||x.kind===targetKind)}
function gcalEventRelations(e){return relationEditor(e._provider==='outlook'?'outlook':'gcal',gcalEntityId(e))}
function linkGoogleEvent(eventIndex,kind,id){const e=gcalEvents[eventIndex];if(!e||!entityTitle(kind,id))return;const eid=gcalEntityId(e),provider=e._provider==='outlook'?'outlook':'gcal';if(db.relations.some(r=>(['gcal','outlook'].includes(r.fromType)&&r.fromId===eid&&r.toType===kind&&r.toId===id)||(['gcal','outlook'].includes(r.toType)&&r.toId===eid&&r.fromType===kind&&r.fromId===id)))return alert('Bereits verknüpft.');db.relations.push({id:uid(),fromType:provider,fromId:eid,toType:kind,toId:id,label:'verknüpft mit',googleTitle:e.summary||'Ohne Titel',googleStart:e.start?.dateTime||e.start?.date||''});save();render()}
function linkGoogleEventSelected(kind){const el=document.getElementById('gcal-link-'+kind);if(el?.value)linkGoogleEvent(gcalDetail,kind,el.value)}
function gcalLinkSelector(kind,caption){return `<label>${caption}<select id="gcal-link-${kind}"><option value="">Bitte wählen …</option>${(db[kind]||[]).map(x=>`<option value="${esc(x.id)}">${esc(entityTitle(kind,x.id))}</option>`).join('')}</select></label><button class="secondary" onclick="linkGoogleEventSelected('${kind}')">Verknüpfen</button>`}
function taskFromGoogleEvent(){const e=gcalEvents[gcalDetail];if(!e)return;const title=prompt('Neue Aufgabe zu diesem Termin:', 'Vorbereitung: '+(e.summary||'Termin'));if(!title?.trim())return;const due=e.start?.date||e.start?.dateTime?.slice(0,10)||'';const task={id:uid(),title:title.trim(),category:'',due,done:false,repeat:'never',notes:'Bezug: '+(e.summary||'Kalendertermin')};db.tasks.unshift(task);const eid=gcalEntityId(e);db.relations.push({id:uid(),fromType:e._provider==='outlook'?'outlook':'gcal',fromId:eid,toType:'tasks',toId:task.id,label:'Aufgabe zum Termin',googleTitle:e.summary||'Ohne Titel',googleStart:e.start?.dateTime||e.start?.date||''});save();alert('Aufgabe angelegt und mit dem Kalendertermin verknüpft.');render()}
function googleRelationsForProject(projectId){const ids=new Set([...relatedTo('projectRecords',projectId,'gcal'),...relatedTo('projectRecords',projectId,'outlook')].map(x=>x.id));for(const x of relatedTo('projectRecords',projectId,'tasks'))for(const t of [...relatedTo('tasks',x.id,'gcal'),...relatedTo('tasks',x.id,'outlook')])ids.add(t.id);return [...ids].map(id=>({id,title:gcalRelationTitle(id),r:db.relations.find(r=>(['gcal','outlook'].includes(r.fromType)&&r.fromId===id)||(['gcal','outlook'].includes(r.toType)&&r.toId===id))})).filter(x=>x.r)}
function projectOverview(id){const kinds=[['tasks','Aufgaben'],['appointments','Termine'],['notes','Wissenseinträge'],['links','Quellen'],['topicRecords','Themen']];return `<div class="panel"><h4>Projekt-Arbeitsbereich</h4>${kinds.map(([kind,label])=>{const items=kind==='tasks'?[...new Map([...relatedTo('projectRecords',id,kind),...khProjectTasks(db.projectRecords.find(p=>p.id===id)||{id,title:''})].map(t=>[t.id,t])).values()]:kind==='appointments'?khAppointments().filter(a=>khProjectKey(a.category)===khProjectKey(db.projectRecords.find(p=>p.id===id)?.title)||relatedTo('projectRecords',id,'appointments').some(r=>r.id===a.id)).map(a=>({id:a.id})):relatedTo('projectRecords',id,kind);return `<h4>${label} (${items.length})</h4>${items.map(x=>`<button class="secondary" style="margin:3px" onclick="openEntity('${kind}','${x.id}')">${esc(entityTitle(kind,x.id)||'Eintrag')}</button>`).join('')||'<p class="hint">Noch keine Zuordnung</p>'}`}).join('')}<h4>Kalendertermine</h4>${googleRelationsForProject(id).map(x=>`<div class="item"><span>📅 ${esc(x.title)}</span> <span class="hint">${esc((x.r.googleStart||'').slice(0,10))}</span></div>`).join('')||'<p class="hint">Noch keine Termine zugeordnet.</p>'}</div>`}

function entityOptions(){return linkableKinds.flatMap(([kind,label])=>(db[kind]||[]).map(x=>({kind,label,id:x.id,title:entityTitle(kind,x.id)}))).filter(x=>x.title)}
function relationEditor(kind,id){let related=relationsFor(kind,id);let options=entityOptions().filter(x=>!(x.kind===kind&&x.id===id));return `<div class="panel" style="padding:12px"><h4>Verknüpfungen (${related.length})</h4>${related.map(r=>{let reverse=r.fromType===kind&&r.fromId===id,k=reverse?r.toType:r.fromType,i=reverse?r.toId:r.fromId,n=entityTitle(k,i),label=linkableKinds.find(v=>v[0]===k)?.[1]||k;return n?`<div class="row" style="margin:5px 0"><button class="secondary" onclick="openEntity('${k}','${i}')">${esc(label)}: ${esc(n)}</button><span class="hint">${esc(r.label)}</span><button class="danger" onclick="removeRelation('${r.id}')">×</button></div>`:''}).join('')||'<p class="hint">Noch keine Verknüpfungen.</p>'}<div class="row"><select id="relationTarget-${kind}-${id}" style="flex:1;min-width:180px"><option value="">Eintrag verknüpfen …</option>${options.map(x=>`<option value="${esc(x.kind+'|'+x.id)}">${esc(x.label)} · ${esc(x.title)}</option>`).join('')}</select><button class="secondary" onclick="addRelation('${kind}','${id}')">Verbinden</button></div></div>`}
function addRelation(kind,id){let v=document.getElementById('relationTarget-'+kind+'-'+id)?.value;if(!v)return;let [k,i]=v.split('|');if(!entityTitle(k,i))return;let exists=db.relations.some(r=>(r.fromType===kind&&r.fromId===id&&r.toType===k&&r.toId===i)||(r.fromType===k&&r.fromId===i&&r.toType===kind&&r.toId===id));if(exists)return alert('Diese Verbindung existiert bereits.');db.relations.push({id:uid(),fromType:kind,fromId:id,toType:k,toId:i,label:'verknüpft mit'});save();render()}
function removeRelation(id){db.relations=db.relations.filter(r=>r.id!==id);save();render()}
function openEntity(kind,id){if(kind==='appointments'){go('appointments');editId=id;render();return;}if(kind==='notes'){selectedNote=id;go('notes')}else if(kind==='tasks'){taskOpen=id;taskView='all';go('tasks')}else if(kind==='gcal'||kind==='outlook'){let i=gcalEvents.findIndex(e=>gcalEntityId(e)===id);if(i>=0){gcalDetail=i;taskView='calendar';go('tasks')}else alert('Dieser Kalendertermin ist momentan nicht geladen. Öffne den entsprechenden Zeitraum im Kalender.')}else if(kind==='projectRecords'||kind==='topicRecords'){detailEntity=id;go(kind)}else{go(kind);editId=id;render()}}
let detailEntity=null;
function khProjectName(s){return String(s||'').trim().replace(/\s+/g,' ')}
function khProjectKey(s){return khProjectName(s).toLocaleLowerCase('de')}
function khProjectForCategory(cat){return db.projectRecords.find(p=>khProjectKey(p.title)===khProjectKey(cat))}
function khProjectTasks(p){return db.tasks.filter(t=>khProjectKey(t.category)===khProjectKey(p.title)||db.relations.some(r=>(r.fromType==='projectRecords'&&r.fromId===p.id&&r.toType==='tasks'&&r.toId===t.id)||(r.toType==='projectRecords'&&r.toId===p.id&&r.fromType==='tasks'&&r.fromId===t.id)))}
function khSyncProjectCategories(){let count=0;for(const category of [...new Set(db.tasks.map(t=>khProjectName(t.category)).filter(Boolean))]){if(!khProjectForCategory(category)){db.projectRecords.push({id:uid(),title:category,goal:'',status:'Aktiv'});count++}}if(count)save();render();if(count)alert(count+' Projekt(e) aus Aufgaben ergänzt. Bestehende Projekte und Aufgaben bleiben erhalten.');}
function khProjectPicker(selected){const options=[...new Set([...db.projectRecords.map(p=>khProjectName(p.title)),...db.tasks.map(t=>khProjectName(t.category))].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));return `<datalist id="khProjectNames">${options.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`}
function projectRecords(){let a=db.projectRecords;let selected=a.find(x=>x.id===detailEntity);return title('Projekte','Konkrete Vorhaben mit Ziel, Status und verknüpften Informationen.')+`<div class="row"><button class="primary" onclick="editId='new';render()">+ Projekt</button><button class="secondary" onclick="khSyncProjectCategories()">↻ Aufgaben-Projekte abgleichen</button><button class="secondary" onclick="go('topicRecords')">Themen ansehen</button></div>`+(editId?formFor('projectRecords',[['title','Projektname','text',true],['goal','Ziel / Beschreibung','textarea'],['status','Status (z. B. Aktiv, Pausiert, Abgeschlossen)'],['start','Beginn','date'],['target','Zieldatum','date']]):'')+`<div class="panel">${a.map(x=>`<div class="item"><button class="secondary" onclick="detailEntity='${x.id}';render()"><strong>${esc(x.title)}</strong></button><span class="pill">${khProjectTasks(x).length} Aufgabe(n)</span><span class="pill">${esc(x.status||'Aktiv')}</span>${x.target?`<span class="hint">Ziel: ${esc(x.target)}</span>`:''}<p class="hint">${esc(x.goal||'')}</p></div>`).join('')||empty()}</div>`+(selected?`<div class="panel"><div class="row"><h3 style="flex:1">${esc(selected.title)}</h3><button class="secondary" onclick="detailEntity=null;render()">Schließen</button></div><p>${esc(selected.goal||'')}</p><p class="hint">${esc(selected.status||'Aktiv')} ${selected.target?' · Ziel: '+esc(selected.target):''}</p>${projectOverview(selected.id)}<button class="primary" onclick="createNoteAttached('projectRecords','${selected.id}')">+ Notiz anheften</button>${relationEditor('projectRecords',selected.id)}${actions('projectRecords',selected.id)}</div>`:'')}
function topicRecords(){let a=db.topicRecords,selected=a.find(x=>x.id===detailEntity);return title('Themen','Langfristige Wissensgebiete mit optionalen Oberthemen.')+`<div class="row"><button class="primary" onclick="editId='new';render()">+ Thema</button></div>`+(editId?topicForm():'')+`<div class="panel">${a.map(x=>`<div class="item" style="${topicStyle(x.title)}"><button class="secondary" onclick="detailEntity='${x.id}';render()">${esc(x.title)}</button>${khTopicParentId(x)?`<span class="hint"> Unterthema von ${esc(entityTitle('topicRecords',khTopicParentId(x))||'unbekannt')}</span>`:''}<p class="hint">${esc(x.description||'')}</p></div>`).join('')||empty()}</div>`+(selected?`<div class="panel"><h3>${esc(selected.title)}</h3><p>${esc(selected.description||'')}</p>${topicContents(selected.id)}<button class="primary" onclick="createNoteAttached('topicRecords','${selected.id}')">+ Wissenseintrag anheften</button>${relationEditor('topicRecords',selected.id)}${actions('topicRecords',selected.id)}</div>`:'')}
function knowledgeTools(){return `<div class="row viewtabs"><button class="secondary" onclick="go('links')">Quellen & PDFs</button><button class="secondary" onclick="go('diagrams')">Diagramme</button><button class="secondary" onclick="go('maps')">Mindmaps</button><button class="secondary" onclick="go('sketches')">Handschrift</button><button class="secondary" onclick="go('habits')">Gewohnheiten</button></div>`}
function quickCreate(){let choice=prompt('Was möchtest du anlegen?\n1 Aufgabe\n2 Wissenseintrag\n3 Projekt\n4 Thema\n5 Quelle\n6 Termin','1');let kind={'1':'tasks','2':'notes','3':'projectRecords','4':'topicRecords','5':'links','6':'appointments'}[choice];if(kind==='appointments'){khNewAppointment();return;}if(kind){go(kind);editId='new';render()}}

let projectFilter='all';
function projects(){const names=[...new Set([...db.notes.map(x=>x.category),...db.tasks.map(x=>x.category),...db.links.map(x=>x.category),...db.cards.map(x=>x.deck)].map(x=>String(x||'Ohne Projekt').trim()||'Ohne Projekt'))].sort((a,b)=>a.localeCompare(b,'de'));let visible=projectFilter==='all'?names:names.filter(x=>x===projectFilter);return title('Projekte & Themen','Alle zugeordneten Wissenseinträge, Aufgaben, Links und PDFs an einem Ort.')+`<div class="panel"><label>Projekt auswählen <select onchange="projectFilter=this.value;render()"><option value="all">Alle Projekte</option>${names.map(n=>`<option value="${esc(n)}" ${projectFilter===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label></div>`+visible.map(name=>{let match=x=>(x||'Ohne Projekt')===name;let ts=db.tasks.filter(x=>match(x.category)),ns=db.notes.filter(x=>match(x.category)),ls=db.links.filter(x=>match(x.category));return `<div class="panel" style="${topicStyle(name)}"><h3 style="color:${topicColor(name)}">${esc(name)}</h3><div class="project-columns"><section><h4>☑ Aufgaben (${ts.length})</h4>${ts.map(x=>`<div class="item"><span>${x.done?'✓':'☐'} ${esc(x.title)}</span> <span class="hint">${esc(x.due||'')}</span></div>`).join('')||'<p class="hint">Keine Aufgaben</p>'}</section><section><h4>▤ Wissen (${ns.length})</h4>${ns.map(x=>`<div class="item"><button class="secondary" onclick="selectedNote='${x.id}';go('notes')">${esc(x.title)}</button></div>`).join('')||'<p class="hint">Keine Wissenseinträge</p>'}</section><section><h4>↗ Links & PDFs (${ls.length})</h4>${ls.map(x=>`<div class="item"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a></div>`).join('')||'<p class="hint">Keine Links oder PDFs</p>'}</section></div></div>`}).join('')||empty()}
function labelColor(name){return db.labelPalette.find(x=>x.name.toLowerCase()===name.trim().toLowerCase())?.color||'#A7B5CA'}
function labelBadges(value){return String(value||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="labelbadge" style="border-color:${labelColor(x)};color:${labelColor(x)}">${esc(x)}</span>`).join('')}
function labelEditor(){let labels=[...new Set([...db.tasks.flatMap(x=>String(x.labels||'').split(',').map(y=>y.trim()).filter(Boolean)),...khAppointments().flatMap(x=>String(x.labels||'').split(',').map(y=>y.trim()).filter(Boolean)),...db.notes.flatMap(x=>String(x.labels||'').split(',').map(y=>y.trim()).filter(Boolean)),...db.labelPalette.map(x=>x.name)])].sort((a,b)=>a.localeCompare(b,'de'));return `<details class="panel"><summary>Label-Farben selbst festlegen</summary><p class="hint">Die Farbe wird für Aufgaben, eigene Termine und Wissensnotizen mit diesem Label verwendet.</p><div class="label-grid">${labels.map(n=>`<label>${esc(n)} <input type="color" aria-label="Farbe für ${esc(n)}" value="${/^#[0-9a-fA-F]{6}$/.test(labelColor(n))?labelColor(n):'#A7B5CA'}" onchange="setLabelColor('${esc(n).replace(/'/g,'&#39;')}',this.value)"></label>`).join('')}</div><form class="row" onsubmit="addLabelColor(event)"><input name="name" placeholder="Neues Label" required style="flex:1"><input type="color" name="color" value="#FF4FC3" aria-label="Neue Labelfarbe" style="width:60px"><button class="secondary">Label anlegen</button></form></details>`}
function setLabelColor(name,color){let x=db.labelPalette.find(x=>x.name===name);if(x)x.color=color;else db.labelPalette.push({id:uid(),name,color});save();render()}
function addLabelColor(e){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;setLabelColor(name,String(f.get('color')))}

function khTaskPopupSubtasks(x){return `<fieldset><legend>Unteraufgaben abhaken</legend>${(x.subtasks||'').split('\n').filter(Boolean).map((v,i)=>`<label class="subtask"><input type="checkbox" ${x.subtasks_done?.[i]?'checked':''} onchange="khTogglePopupSubtask(decodeURIComponent('${encodeURIComponent(x.id).replace(/'/g,'%27')}'),${i},this.checked)"> ${esc(v)}</label>`).join('')||'<p class="hint">Keine Unteraufgaben vorhanden.</p>'}<p class="hint">Häkchen werden sofort gespeichert. Änderungen am Unteraufgabentext unten mit „Speichern“ übernehmen.</p></fieldset>`;}
function khTogglePopupSubtask(id,index,checked){const task=db.tasks.find(t=>t.id===id);if(!task)return;task.subtasks_done={...(task.subtasks_done||{}),[index]:!!checked};save();}
// Hub-only per-occurrence state; imported source data is never modified.
function khArchiveKey(e){return gcalEntityId(e);}
function khIsArchived(e){return (db.calendarArchives||[]).some(a=>a.eventId===khArchiveKey(e)&&a.archived);}
function khArchiveEvent(index){const e=gcalEvents[index];if(!e)return;const eventId=khArchiveKey(e);let a=(db.calendarArchives||=[]).find(a=>a.eventId===eventId);if(!a){a={eventId,revision:null};db.calendarArchives.push(a);}if(!Object.hasOwn(a,'syncBase'))a.syncBase=a.revision||null;Object.assign(a,{archived:true,event:structuredClone(e),changedAt:new Date().toISOString(),revision:uid()});gcalDetail=null;save();render();}
function khRestoreCalendarEvent(eventId){const a=(db.calendarArchives||[]).find(a=>a.eventId===eventId);if(!a)return;if(!Object.hasOwn(a,'syncBase'))a.syncBase=a.revision||null;a.archived=false;a.changedAt=new Date().toISOString();a.revision=uid();save();render();}
function khCalendarArchivePanel(){const rows=(db.calendarArchives||[]).filter(a=>a.archived&&JSON.stringify(a.event).toLowerCase().includes(search.toLowerCase()));return `<div class="panel"><h3>Archivierte Kalendertermine (${rows.length})</h3><p class="hint">Nur im Knowledge Hub ausgeblendet. Quellkalender, Labels, Notizen und Verknüpfungen bleiben erhalten. Bei Serien wird nur dieses Vorkommen archiviert. Wiederhergestellte Termine erscheinen, sobald Quelle und Zeitraum geladen sind und der Kalender eingeblendet ist.</p><button class="secondary" onclick="khReloadCalendarArchives()">Cloud-Archivstand laden</button>${rows.map(a=>`<div class="item"><strong>${esc(a.event?.summary||'Kalendertermin')}</strong><p class="hint">${esc(a.event?._calendarName||'')} · ${esc(a.event?.start?.dateTime?new Date(a.event.start.dateTime).toLocaleString('de-DE'):a.event?.start?.date||'')}</p><button class="secondary" onclick="khRestoreCalendarEvent(decodeURIComponent('${encodeURIComponent(a.eventId).replace(/'/g,'%27')}'))">Wiederherstellen</button></div>`).join('')||'<p class="hint">Keine archivierten Kalendertermine.</p>'}</div>`;}
async function khReadCalendarArchives(){let rows=[],offset=0;while(true){const batch=await cloudRequest('/rest/v1/kh_calendar_archives?select=event_id,archived,event_data,revision,changed_at&order=event_id.asc&limit=1000&offset='+offset);rows.push(...batch);if(batch.length<1000)break;offset+=1000;}return rows.map(r=>({eventId:r.event_id,archived:r.archived,event:r.event_data,revision:r.revision,changedAt:r.changed_at}));}
async function khRefreshCalendarArchives(){const remote=await khReadCalendarArchives();const pending=(db.calendarArchives||[]).filter(a=>Object.hasOwn(a,'syncBase'));db.calendarArchives=[...remote.filter(r=>!pending.some(a=>a.eventId===r.eventId)),...pending];localStorage.setItem(KEY,JSON.stringify(db));return db.calendarArchives;}
async function khReloadCalendarArchives(){try{if(!cloudSession)throw Error('Bitte zuerst anmelden.');if((db.calendarArchives||[]).some(a=>Object.hasOwn(a,'syncBase'))&&!confirm('Noch nicht synchronisierte Archiv-Änderungen verwerfen und den Cloud-Stand laden? Andere Hub-Daten bleiben erhalten.'))return;await ensureToken();db.calendarArchives=await khReadCalendarArchives();save();render();}catch(e){alert('Archiv nicht geladen: '+e.message);}}

function nextRepeatDate(iso,frequency){
  const [y,m,d]=iso.split('-').map(Number);let date=new Date(Date.UTC(y,m-1,d));
  if(frequency==='daily')date.setUTCDate(date.getUTCDate()+1);
  else if(frequency==='weekly')date.setUTCDate(date.getUTCDate()+7);
  else if(frequency==='yearly'){
    const last=new Date(Date.UTC(y+1,m,0)).getUTCDate();
    date=new Date(Date.UTC(y+1,m-1,Math.min(d,last)));
  }
  else if(frequency==='monthly'){
    let first=new Date(Date.UTC(y,m,1));
    let last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
    date=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),Math.min(d,last)));
  }
  return date.toISOString().slice(0,10);
}

async function outlookLoadCalendars(){if(!outlookAccounts.length)return;outlookLoading=true;try{const results=await Promise.allSettled(outlookAccounts.map(async a=>{let url='/me/calendars?$select=id,name,color,canEdit&$top=100',out=[];while(url&&out.length<300){let r=await outlookGraph(url,a);out.push(...(r.value||[]));url=r['@odata.nextLink']||''}return out.map(c=>({...c,_accountId:a.homeAccountId,_accountName:a.username,_key:a.homeAccountId+'::'+c.id}))}));outlookCalendars=results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value);outlookError=results.filter(r=>r.status==='rejected').map(r=>r.reason?.message||String(r.reason)).join(' | ');for(const c of outlookCalendars)if(!(c._key in outlookSelected))outlookSelected[c._key]=true;outlookSaveSelected()}catch(e){outlookError=e.message}finally{outlookLoading=false;render()}}
