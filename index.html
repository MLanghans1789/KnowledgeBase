const KEY='knowledge-hub-v1';const initial={notes:[{id:'demo1',title:'Was ist Co-Kriging?',category:'Geostatistik',tags:'Interpolation, QGIS',content:'Co-Kriging nutzt zusätzlich zur Zielvariablen räumlich korrelierte Hilfsvariablen. Beispiel für einen Wissenseintrag.',created:'2026-10-18'}],tasks:[{id:'t1',title:'Fachartikel zu Foundation Models lesen',done:false,due:'',category:'Fernerkundung'}],links:[{id:'l1',title:'Copernicus Data Space',url:'https://dataspace.copernicus.eu',category:'Fernerkundung',notes:'Zugang zu Copernicus-Daten',kind:'Weblink'}],cards:[{id:'c1',front:'Was bedeutet Bootstrapping beim Random Forest?',back:'Ziehen von Trainingsstichproben mit Zurücklegen, für jeden Baum separat.',deck:'Machine Learning',due:'2026-10-18',interval:0,repetitions:0}],maps:[{id:'map1',title:'Meine erste Mindmap',nodes:[{id:'n1',text:'Wissensdatenbank',x:220,y:120},{id:'n2',text:'Fachartikel',x:40,y:260},{id:'n3',text:'Lernkarten',x:370,y:270}],edges:[['n1','n2'],['n1','n3']]}],sketches:[],habits:[],chartTables:[],labelPalette:[],diagrams:[{id:'d1',title:'Beispiel: Forschungsworkflow',category:'Methoden',source:'flowchart LR\n A[Fragestellung] --> B[Daten]\n B --> C[Analyse]\n C --> D[Ergebnis]'}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)};for(const k of Object.keys(initial))if(!Array.isArray(db[k]))db[k]=[];let taskOpen=null;let noteView="graph",selectedNote=null;let page='dashboard',editId=null,showAnswer=false,cardIndex=0,search='',taskView='all',taskProject='all',cardTopic='all',globalQuery='',calendarOffset=0;const sections=[['dashboard','⌂ Übersicht'],['notes','▤ Wissen'],['projects','◈ Projekte & Themen'],['tasks','☑ Aufgaben'],['habits','◷ Gewohnheiten'],['links','↗ Links & PDFs'],['cards','▣ Karteikarten'],['diagrams','◇ Diagramme'],['maps','◎ Mindmap'],['sketches','✎ Handschrift'],['settings','⚙ Daten & Export']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const today=()=>new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(KEY,JSON.stringify(db));scheduleCloudSave()}function go(p){page=p;editId=null;search='';render()}function render(){document.getElementById('nav').innerHTML=sections.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');document.getElementById('main').innerHTML=({dashboard,notes,projects,tasks,habits,links,cards,diagrams,maps,sketches,settings,globalResults})[page]();if(page==='maps')setupMap();if(page==='notes'&&noteView==='graph')setupNoteDrag();if(page==='sketches')setupSketch();document.getElementById('globalSearch').value=globalQuery;}function globalSearchChanged(){page='globalResults';editId=null;render();let e=document.getElementById('globalSearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)}function title(t,s){return `<div class="top"><div><h2>${t}</h2><p class="muted">${s}</p></div></div>`}function empty(){return '<div class="empty">Noch keine Einträge vorhanden.</div>'}function tags(s){return String(s||'').split(',').filter(Boolean).map(t=>`<span class="pill">${esc(t.trim())}</span>`).join('')}function dashboard(){return title('Dein Wissen an einem Ort','Notizen, Quellen, Aufgaben und Lernkarten miteinander verbinden.')+`<div class="cards">${[['Wissenseinträge',db.notes.length,'notes'],['Offene Aufgaben',db.tasks.filter(x=>!x.done).length,'tasks'],['Links & PDFs',db.links.length,'links'],['Karteikarten',db.cards.length,'cards']].map(([l,n,p])=>`<div class="metric" onclick="go('${p}')" style="cursor:pointer"><strong>${n}</strong>${l}</div>`).join('')}</div><div class="panel"><h3>Offene Aufgaben</h3>${db.tasks.filter(x=>!x.done).slice(0,5).map(x=>`<div class="item">☐ ${esc(x.title)}</div>`).join('')||empty()}</div><div class="panel"><h3>Zu wiederholende Karteikarten</h3><p>${db.cards.filter(c=>(c.due||today())<=today()).length} Karte(n) sind heute fällig.</p><button class="primary" onclick="go('cards')">Jetzt lernen</button></div>`}function filtered(arr){return arr.filter(x=>JSON.stringify(x).toLowerCase().includes(search.toLowerCase()))}function toolbar(label){return `<div class="row"><input style="flex:1;min-width:160px" aria-label="Suche" placeholder="Sammlung durchsuchen" value="${esc(search)}" oninput="search=this.value;renderKeepFocus()"><button class="primary" onclick="editId='new';render()">+ ${label}</button></div>`}function renderKeepFocus(){const pos=document.activeElement.selectionStart;render();const e=document.querySelector('input[aria-label="Suche"]');e.focus();e.setSelectionRange(pos,pos)}function formFor(kind,fields){const x=editId==='new'?{}:db[kind].find(z=>z.id===editId)||{};return `<div class="panel"><h3>${editId==='new'?'Neu anlegen':'Bearbeiten'}</h3><form class="form" onsubmit="submitEntry(event,'${kind}')">${fields.map(([name,label,type,required])=>`<label>${label}${type==='textarea'?`<textarea name="${name}" ${required?'required':''}>${esc(x[name])}</textarea>`:name==='repeat' ? `<select name="repeat">${[['never','Nie'],['daily','Täglich'],['weekly','Wöchentlich'],['monthly','Monatlich']].map(([v,t])=>`<option value="${v}" ${(x.repeat|| (x.repeat_weekly?'weekly':'never'))===v?'selected':''}>${t}</option>`).join('')}</select>` : `<input name="${name}" type="${type||'text'}" value="${esc(x[name])}" ${required?'required':''}>`}</label>`).join('')}<div class="row"><button class="primary">Speichern</button><button type="button" class="secondary" onclick="editId=null;render()">Abbrechen</button></div></form></div>`}function submitEntry(e,kind){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));if(kind==='links'){try{const u=new URL(obj.url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{alert('Bitte eine gültige https://- oder http://-Adresse eingeben.');return}}if(kind==='notes'){const old=editId==='new'?null:db.notes.find(x=>x.id===editId);obj.connections=old?.connections||[]}if(kind==='cards'){obj.due=today();obj.interval=0;obj.repetitions=0}if(kind==='tasks'){let old=editId==='new'?null:db.tasks.find(x=>x.id===editId);obj.done=old?.done||false;obj.completed_at=old?.completed_at||null;obj.subtasks_done=old?.subtasks_done||{};obj.repeat=['never','daily','weekly','monthly'].includes(obj.repeat)?obj.repeat:'never';obj.repeat_weekly=obj.repeat==='weekly';if(obj.repeat!=='never'&&!obj.due){alert('Für wiederkehrende Aufgaben bitte ein erstes Fälligkeitsdatum wählen.');return}}if(editId==='new')db[kind].unshift({id:uid(),...obj});else db[kind]=db[kind].map(x=>x.id===editId?{...x,...obj}:x);editId=null;save();render()}function del(kind,id){if(kind==='notes'){db.notes.forEach(n=>n.connections=(n.connections||[]).filter(v=>v!==id));if(selectedNote===id)selectedNote=null;}if(confirm('Eintrag wirklich löschen?')){db[kind]=db[kind].filter(x=>x.id!==id);save();render()}}function actions(kind,id){return `<div class="row"><button class="secondary" onclick="editId='${id}';render()">Bearbeiten</button><button class="danger" onclick="del('${kind}','${id}')">Löschen</button></div>`}function noteGraph(){let a=filtered(db.notes),w=1000,h=650,positions={};a.forEach((n,i)=>{let angle=i*2.3999632297,r=55+Math.sqrt(i+1)*Math.min(70,360/Math.sqrt(Math.max(1,a.length)));positions[n.id]=n.nodePos&&Number.isFinite(n.nodePos.x)&&Number.isFinite(n.nodePos.y)?n.nodePos:{x:w/2+Math.cos(angle)*r,y:h/2+Math.sin(angle)*r}});let edges=a.flatMap(n=>(n.connections||[]).filter(id=>positions[id]&&n.id<id).map(id=>`<line data-edge-from="${n.id}" data-edge-to="${id}" x1="${positions[n.id].x}" y1="${positions[n.id].y}" x2="${positions[id].x}" y2="${positions[id].y}" stroke="#7085a6" stroke-width="2"/>`));return `<div class="panel"><p class="hint">Knoten mit Maus oder Finger verschieben. Antippen öffnet die Notiz. Positionen werden in Supabase gespeichert.</p><div class="graphscroll"><svg id="knowledgeGraph" viewBox="0 0 ${w} ${h}" role="group" aria-label="Verschiebbares Wissensnetzwerk">${edges.join('')}${a.map(n=>`<g class="knowledge-node" data-node-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title)}" transform="translate(${positions[n.id].x} ${positions[n.id].y})"><circle r="13" fill="${topicColor(n.category)}" stroke="#0b1527" stroke-width="3"/><text x="19" y="5" fill="#f2f6ff" font-size="14">${esc(n.title.slice(0,29))}</text></g>`).join('')}</svg></div>${noteLinkForm()}</div>`}
function setupNoteDrag(){const svg=document.getElementById('knowledgeGraph');if(!svg)return;let drag=null;function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let matrix=svg.getScreenCTM();return matrix?p.matrixTransform(matrix.inverse()):{x:0,y:0}}svg.querySelectorAll('.knowledge-node').forEach(g=>{g.style.cursor='grab';g.addEventListener('pointerdown',e=>{if(e.button!==0)return;let n=db.notes.find(x=>x.id===g.dataset.nodeId);if(!n)return;let p=point(e);let base=n.nodePos||{x:500,y:325};if(!n.nodePos){let tr=g.transform.baseVal.consolidate();if(tr)base={x:tr.matrix.e,y:tr.matrix.f}}drag={id:n.id,g,start:p,base,moved:false};g.setPointerCapture(e.pointerId);e.preventDefault()});g.addEventListener('pointermove',e=>{if(!drag||drag.g!==g)return;let p=point(e),dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(Math.hypot(dx,dy)>4)drag.moved=true;let x=Math.max(18,Math.min(900,drag.base.x+dx)),y=Math.max(20,Math.min(625,drag.base.y+dy));g.setAttribute('transform',`translate(${x} ${y})`);svg.querySelectorAll('line').forEach(l=>{if(l.dataset.edgeFrom===drag.id){l.setAttribute('x1',x);l.setAttribute('y1',y)}if(l.dataset.edgeTo===drag.id){l.setAttribute('x2',x);l.setAttribute('y2',y)}})});g.addEventListener('pointerup',e=>{if(!drag||drag.g!==g)return;let d=drag;drag=null;if(d.moved){let tr=g.transform.baseVal.consolidate(),n=db.notes.find(x=>x.id===d.id);if(n&&tr){n.nodePos={x:tr.matrix.e,y:tr.matrix.f};save()}}else{selectedNote=d.id;render()}});g.addEventListener('pointercancel',()=>drag=null);g.addEventListener('keydown',e=>{if(e.key==='Enter'){selectedNote=g.dataset.nodeId;render()}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let n=db.notes.find(x=>x.id===g.dataset.nodeId);let tr=g.transform.baseVal.consolidate();let p=n.nodePos||{x:tr.matrix.e,y:tr.matrix.f};n.nodePos={x:Math.max(18,Math.min(900,p.x+(e.key==='ArrowRight'?15:e.key==='ArrowLeft'?-15:0))),y:Math.max(20,Math.min(625,p.y+(e.key==='ArrowDown'?15:e.key==='ArrowUp'?-15:0)))};save();render()}})})}
const topicPalette=['#00E5FF','#FF4FC3','#B3FF33','#FFB000','#8A7DFF','#00F5A0','#FF5D5D','#4DA3FF','#F7F047','#E879FF','#FF8552','#50E0D1'];
function topicColor(topic){let h=2166136261;for(const ch of String(topic||'Ohne Projekt')){h=Math.imul(h^ch.charCodeAt(0),16777619)}return topicPalette[(h>>>0)%topicPalette.length]}
function topicStyle(topic){let c=topicColor(topic);return `border-left:6px solid ${c};background:linear-gradient(90deg,${c}30,transparent 85%);border-radius:9px;padding-left:12px`}
function unlinkNotes(a,b){let x=db.notes.find(n=>n.id===a),y=db.notes.find(n=>n.id===b);if(!x||!y)return;x.connections=(x.connections||[]).filter(id=>id!==b);y.connections=(y.connections||[]).filter(id=>id!==a);save();render()}

function taskCalendar(items){let d=new Date();d.setMonth(d.getMonth()+calendarOffset);let year=d.getFullYear(),month=d.getMonth(),first=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push('<div class="day outside"></div>');for(let day=1;day<=days;day++){let date=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');cells.push(`<div class="day ${date===today()?'current':''}"><strong>${day}</strong>${items.filter(x=>x.due===date).map(x=>`<div class="cal-task ${x.done?'done':''}" style="${topicStyle(x.category)}" title="${esc(x.category||'')}" onclick="editId='${x.id}';render()">${esc(x.title)}</div>`).join('')}</div>`)}return `<div class="panel"><div class="row"><button class="secondary" onclick="calendarOffset--;render()">←</button><h3 style="margin:0">${esc(d.toLocaleDateString('de-DE',{month:'long',year:'numeric'}))}</h3><button class="secondary" onclick="calendarOffset++;render()">→</button><button class="secondary" onclick="calendarOffset=0;render()">Heute</button></div><p class="hint">Monatsansicht · Aufgaben anklicken zum Bearbeiten. Aufgaben ohne Datum findest du unter „Ohne Termin“.</p><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function nextRepeatDate(iso,frequency){
  const [y,m,d]=iso.split('-').map(Number);let date=new Date(Date.UTC(y,m-1,d));
  if(frequency==='daily')date.setUTCDate(date.getUTCDate()+1);
  else if(frequency==='weekly')date.setUTCDate(date.getUTCDate()+7);
  else if(frequency==='monthly'){
    let first=new Date(Date.UTC(y,m,1));
    let last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();
    date=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),Math.min(d,last)));
  }
  return date.toISOString().slice(0,10);
}

   x.due=next;x.done=false;x.last_completed=today();x.completed_at=null;
 }else{x.done=!x.done;x.completed_at=x.done?new Date().toISOString():null}save();render()}

async function sketchApi(path,options={}){await ensureToken();let r=await fetch(CLOUD_URL+path,{...options,headers:{apikey:CLOUD_KEY,Authorization:'Bearer '+cloudSession.access_token,...(options.headers||{})}});if(!r.ok)throw Error(r.status+' '+(await r.text()).slice(0,250));return r}
async function uploadSketch(x){let user=await cloudRequest('/auth/v1/user');let path=user.id+'/'+x.id+'.png';let blob=await (await fetch(x.data)).blob();await sketchApi('/storage/v1/object/kh-sketches/'+path,{method:'POST',headers:{'Content-Type':'image/png','x-upsert':'true'},body:blob});await cloudRequest('/rest/v1/kh_handwritten_notes?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:x.id,user_id:user.id,title:x.title,storage_path:path}])})}
async function loadCloudSketches(){let rows=await cloudRequest('/rest/v1/kh_handwritten_notes?select=*');let result=[];for(let x of rows){if(!x.storage_path)continue;try{let r=await sketchApi('/storage/v1/object/authenticated/kh-sketches/'+x.storage_path);let blob=await r.blob();let data=await new Promise((resolve,reject)=>{let f=new FileReader();f.onload=()=>resolve(f.result);f.onerror=reject;f.readAsDataURL(blob)});result.push({id:x.id,title:x.title,data})}catch(e){console.warn('Handschrift konnte nicht geladen werden',x.id,e)}}return result}
async function deleteCloudSketch(id){let user=await cloudRequest('/auth/v1/user');let path=user.id+'/'+id+'.png';await sketchApi('/storage/v1/object/kh-sketches/'+path,{method:'DELETE'});await cloudRequest('/rest/v1/kh_handwritten_notes?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}
async function cloudLogin(email,password){let r=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Anmeldung fehlgeschlagen');cloudSession=d;sessionStorage.setItem(CLOUD_TOKEN_KEY,JSON.stringify(d));await cloudLoad()}
async function refreshCloudToken(){if(!cloudSession?.refresh_token)throw Error('Bitte erneut anmelden');let r=await fetch(CLOUD_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:cloudSession.refresh_token})});let d=await r.json();if(!r.ok)throw Error('Sitzung abgelaufen. Bitte erneut anmelden.');cloudSession=d;sessionStorage.setItem(CLOUD_TOKEN_KEY,JSON.stringify(d))}
async function ensureToken(){if(cloudSession?.expires_at && Date.now()/1000>cloudSession.expires_at-90)await refreshCloudToken()}
async function cloudLoad(){statusText('Lade Cloud-Daten …');await ensureToken();let next=structuredClone(initial);for(const k of Object.keys(next))next[k]=[];for(const [kind,spec] of Object.entries(cloudSpecs)){const rows=await cloudRequest('/rest/v1/'+spec.table+'?select=*');next[kind]=rows.map(spec.from)}// Nicht synchronisierte Module bleiben lokal, werden nie als Cloud-Sicherung bezeichnet.
next.diagrams=db.diagrams||[];next.sketches=db.sketches||[];const cloudSketches=await loadCloudSketches();next.sketches=[...cloudSketches,...next.sketches.filter(x=>!cloudSketches.some(y=>y.id===x.id))];db=next;cloudLoaded=true;localStorage.setItem(KEY,JSON.stringify(db));document.body.classList.remove('locked');document.getElementById('logoutButton').style.display='inline-block';statusText('Cloud verbunden · Handschrift synchronisiert');render()}
function scheduleCloudSave(){if(!cloudLoaded)return;cloudDirty=true;statusText('Speichere …');clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSync,700)}
async function cloudSync(){if(cloudBusy||!cloudDirty)return;cloudBusy=true;cloudDirty=false;try{await ensureToken();const user=await cloudRequest('/auth/v1/user');for(const [kind,spec] of Object.entries(cloudSpecs)){let rows=db[kind].map(x=>({...spec.to(x),user_id:user.id}));let existing=await cloudRequest('/rest/v1/'+spec.table+'?select=id');let ids=new Set(rows.map(x=>x.id));let removed=existing.filter(x=>!ids.has(x.id)).map(x=>x.id);if(rows.length)await cloudRequest('/rest/v1/'+spec.table+'?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});/* Sicherheit: kein automatisches Massenloeschen beim Synchronisieren. */}statusText('Cloud gespeichert')}catch(e){cloudDirty=true;statusText('⚠ Cloud-Speicherung fehlgeschlagen');alert('Cloud-Speicherung fehlgeschlagen. Änderungen sind vorläufig nur lokal. Bitte JSON-Backup exportieren.\n'+e.message)}finally{cloudBusy=false;if(cloudDirty)statusText('⚠ Nicht vollständig synchronisiert')}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;document.getElementById('loginError').textContent='';try{let f=new FormData(e.target);await cloudLogin(f.get('email'),f.get('password'))}catch(err){document.getElementById('loginError').textContent=err.message;statusText('Nicht angemeldet')}finally{b.disabled=false}});
document.getElementById('logoutButton').addEventListener('click',()=>{clearTimeout(cloudTimer);if(cloudDirty){alert('Noch nicht synchronisierte Änderungen. Bitte zuerst eine Sicherung exportieren.');return}cloudSession=null;cloudLoaded=false;sessionStorage.removeItem(CLOUD_TOKEN_KEY);document.body.classList.add('locked');document.getElementById('logoutButton').style.display='none';statusText('Abgemeldet')});
(async()=>{try{let old=sessionStorage.getItem(CLOUD_TOKEN_KEY);if(old){cloudSession=JSON.parse(old);await cloudLoad()}}catch(e){cloudSession=null;sessionStorage.removeItem(CLOUD_TOKEN_KEY);statusText('Bitte anmelden')}})();

</script></body></html>
